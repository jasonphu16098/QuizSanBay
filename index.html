 và dải hãm đầu dài 200m. ASDA là bao nhiêu?","o":["2700m","2500m","2900m","2300m"],"a":[0],"e":"Theo file, ASDA = TORA + chiều dài dải hãm đầu = 2500 + 200 = 2700m.","w":{"b":"Kết quả này bỏ qua dải hãm đầu. ASDA bằng TORA cộng dải hãm đầu.","c":"Kết quả này cộng dải hãm đầu hai lần. ASDA = 2500 + 200 = 2700m.","d":"Kết quả này là phép trừ. ASDA bằng TORA cộng chiều dài dải hãm đầu."},"t":"500"},{"s":5,"u":"Tính các cự ly công bố","n":"501","q":"Một đường CHC có TORA 3200m, dải quang 150m và dải hãm đầu 300m. TODA và ASDA lần lượt là bao nhiêu?","o":["TODA 3350m, ASDA 3500m","TODA 3650m, ASDA 3650m","TODA 3200m, ASDA 3200m","TODA 3500m, ASDA 3350m"],"a":[0],"e":"TODA = TORA + dải quang = 3200 + 150 = 3350m. ASDA = TORA + dải hãm đầu = 3200 + 300 = 3500m.","w":{"b":"Kết quả này cộng cả hai dải vào mỗi cự ly. Mỗi cự ly chỉ cộng một dải.","c":"Kết quả này bỏ qua cả hai dải.","d":"Hai giá trị bị đảo. TODA cộng dải quang (150m), ASDA cộng dải hãm đầu (300m)."},"t":"501"},{"s":5,"u":"Tính các cự ly công bố","n":"502","q":"Một đường CHC có TORA 3200m, dải quang 150m và dải hãm đầu 300m. Cự ly nào lớn hơn, và lớn hơn bao nhiêu?","o":["TODA lớn hơn ASDA 150m","ASDA lớn hơn TODA 150m","ASDA lớn hơn TODA 300m","Hai cự ly bằng nhau"],"a":[1],"e":"ASDA = 3500m, TODA = 3350m. Hiệu bằng 3500 - 3350 = 150m.","w":{"a":"Dải hãm đầu (300m) dài hơn dải quang (150m) nên ASDA lớn hơn.","c":"300m là chiều dài dải hãm đầu. Hiệu của hai cự ly là 300 - 150 = 150m.","d":"Hai dải có chiều dài khác nhau nên hai cự ly khác nhau."},"t":"502"},{"s":5,"u":"Tính các cự ly công bố","n":"503","q":"Một đường CHC có TORA 2800m, không có dải quang và không có dải hãm đầu. TODA và ASDA là bao nhiêu?","o":["TODA 3100m, ASDA 3100m","TODA 0m, ASDA 2800m","TODA 2800m, ASDA 0m","Cả hai đều bằng 2800m"],"a":[3],"e":"File ghi TODA = TORA + dải quang \"nếu có\". Không có dải thì phần cộng thêm bằng 0, nên TODA = ASDA = TORA = 2800m.","w":{"a":"Không có dải nào để cộng thêm.","b":"TODA không bằng 0. Khi không có dải quang, TODA bằng TORA.","c":"ASDA không bằng 0. Khi không có dải hãm đầu, ASDA bằng TORA."},"t":"503"},{"s":5,"u":"Tính các cự ly công bố","n":"504","q":"Một đường CHC có dải quang và dải hãm đầu cùng dài 300m. Quan hệ giữa TODA và ASDA là gì?","o":["ASDA lớn hơn TODA","TODA bằng TORA, ASDA bằng TORA cộng 300m","TODA lớn hơn ASDA","TODA bằng ASDA, cùng bằng TORA cộng 300m"],"a":[3],"e":"TODA = TORA + 300 và ASDA = TORA + 300 nên hai cự ly bằng nhau.","w":{"a":"Hai dải bằng nhau nên hai cự ly bằng nhau.","b":"Cả hai cự ly đều được cộng 300m.","c":"Hai dải bằng nhau nên hai cự ly bằng nhau."},"t":"504"},{"s":5,"u":"Tính các cự ly công bố","n":"505","q":"Việc xây thêm một dải quang dài 400m ở cuối đường CHC làm thay đổi cự ly nào?","o":["Chỉ ASDA tăng thêm 400m","Cả TORA và TODA tăng thêm 400m","Chỉ TODA tăng thêm 400m","Chỉ LDA tăng thêm 400m"],"a":[2],"e":"Dải quang chỉ được cộng vào TODA. TORA, ASDA và LDA giữ nguyên.","w":{"a":"ASDA chỉ cộng dải hãm đầu.","b":"TORA là chiều dài thực của đoạn đường CHC dùng chạy đà, không tính dải quang.","d":"LDA là chiều dài hạ cánh thực của đường CHC, không cộng dải quang."},"t":"505"},{"s":5,"u":"Tính các cự ly công bố","n":"506","q":"Việc xây thêm một dải hãm đầu dài 400m ở cuối đường CHC làm thay đổi cự ly nào?","o":["Chỉ ASDA tăng thêm 400m","Cả TORA và ASDA tăng thêm 400m","Chỉ TODA tăng thêm 400m","Chỉ LDA tăng thêm 400m"],"a":[0],"e":"Dải hãm đầu (khoảng dừng, Stopway) chỉ được cộng vào ASDA. TORA, TODA và LDA giữ nguyên.","w":{"b":"TORA là chiều dài thực của đoạn đường CHC dùng chạy đà, không tính dải hãm đầu.","c":"TODA chỉ cộng dải quang.","d":"LDA là chiều dài hạ cánh thực, không cộng dải hãm đầu."},"t":"506"},{"s":5,"u":"Tính các cự ly công bố","n":"507","q":"Quan hệ nào luôn đúng giữa TORA, TODA và ASDA theo các công thức của file?","o":["TODA luôn bằng ASDA","TODA và ASDA đều lớn hơn hoặc bằng TORA","TORA luôn là cự ly lớn nhất","ASDA luôn nhỏ hơn TODA"],"a":[1],"e":"TODA = TORA + dải quang và ASDA = TORA + dải hãm đầu. Chiều dài hai dải không âm nên cả hai cự ly không nhỏ hơn TORA.","w":{"a":"Chỉ bằng nhau khi dải quang và dải hãm đầu dài bằng nhau.","c":"TODA và ASDA đều cộng thêm vào TORA nên không nhỏ hơn TORA.","d":"ASDA và TODA phụ thuộc chiều dài của dải hãm đầu và dải quang, hai dải này độc lập với nhau."},"t":"507"},{"s":5,"u":"Tính các cự ly công bố","n":"508","q":"Phi công cân nhắc dừng khi cất cánh bỏ dở. Cự ly nào trong bốn cự ly công bố liên quan trực tiếp đến việc dừng này?","o":["TORA","TODA","ASDA","LDA"],"a":[2],"e":"ASDA là cự ly hãm đà, có thể dừng khẩn cấp, và gồm TORA cộng dải hãm đầu (khoảng dừng).","w":{"a":"TORA chỉ cho biết đoạn chạy đà để cất cánh.","b":"TODA tính đến dải quang dành cho đoạn cất cánh ban đầu.","d":"LDA dùng khi hạ cánh."},"t":"508"},{"s":5,"u":"Tính các cự ly công bố","n":"509","q":"Khi đánh giá đoạn cất cánh ban đầu của tàu bay trên một đường CHC có dải quang, cự ly nào cần dùng?","o":["TODA","TORA","LDA","ASDA"],"a":[0],"e":"Dải quang tạo thuận tiện cho đoạn cất cánh ban đầu đến độ cao quy định và được cộng vào TODA.","w":{"b":"TORA không tính phần dải quang.","c":"LDA dùng khi hạ cánh.","d":"ASDA cộng dải hãm đầu, dùng cho trường hợp dừng."},"t":"509"},{"s":5,"u":"Giải mã PCN và so sánh ACN với PCN","n":"510","q":"Một mặt đường công bố PCN 80/R/B/W/T. Theo bảng của file, các chữ R, B, W, T có nghĩa là gì?","o":["Mặt đường cứng, cường độ nền trung bình, áp suất bánh không hạn chế, đánh giá bằng kỹ thuật","Mặt đường cứng, cường độ nền trung bình, áp suất bánh đến 1,5MPa, đánh giá bằng kinh nghiệm","Mặt đường mềm, cường độ nền trung bình, áp suất bánh không hạn chế, đánh giá bằng kỹ thuật","Mặt đường cứng, cường độ nền thấp, áp suất bánh không hạn chế, đánh giá bằng kỹ thuật"],"a":[0],"e":"R: cứng. B: trung bình. W: cao, không hạn chế. T: đánh giá kỹ thuật. Số 80 đứng đầu chuỗi là giá trị PCN.","w":{"b":"W là không hạn chế (X mới là 1,5MPa) và T là kỹ thuật (U là kinh nghiệm).","c":"R là mặt đường cứng. Mặt đường mềm là F.","d":"B là trung bình. Mức thấp là C."},"t":"510"},{"s":5,"u":"Giải mã PCN và so sánh ACN với PCN","n":"511","q":"Một mặt đường công bố PCN 55/F/C/Y/U. Theo bảng của file, các chữ F, C, Y, U có nghĩa là gì?","o":["Mặt đường mềm, cường độ nền rất thấp, áp suất bánh giới hạn đến 1,0MPa, đánh giá bằng kinh nghiệm","Mặt đường mềm, cường độ nền thấp, áp suất bánh giới hạn đến 0,5MPa, đánh giá bằng kỹ thuật","Mặt đường cứng, cường độ nền thấp, áp suất bánh giới hạn đến 1,0MPa, đánh giá bằng kinh nghiệm","Mặt đường mềm, cường độ nền thấp, áp suất bánh giới hạn đến 1,0MPa, đánh giá bằng kinh nghiệm"],"a":[3],"e":"F: mềm. C: thấp. Y: thấp, giới hạn đến 1,0MPa. U: đánh giá bằng kinh nghiệm.","w":{"a":"C là thấp. Mức rất thấp là D.","b":"Y giới hạn 1,0MPa (Z mới là 0,5MPa) và U là kinh nghiệm (T là kỹ thuật).","c":"F là mặt đường mềm. Mặt đường cứng là R."},"t":"511"},{"s":5,"u":"Giải mã PCN và so sánh ACN với PCN","n":"512","q":"Một mặt đường công bố PCN 40/F/D/Z/U. Theo bảng của file, các chữ F, D, Z, U có nghĩa là gì?","o":["Mặt đường mềm, cường độ nền rất thấp, áp suất bánh giới hạn đến 0,5MPa, đánh giá bằng kinh nghiệm","Mặt đường mềm, cường độ nền cao, áp suất bánh giới hạn đến 0,5MPa, đánh giá bằng kinh nghiệm","Mặt đường mềm, cường độ nền rất thấp, áp suất bánh không hạn chế, đánh giá bằng kinh nghiệm","Mặt đường cứng, cường độ nền rất thấp, áp suất bánh giới hạn đến 0,5MPa, đánh giá bằng kỹ thuật"],"a":[0],"e":"F: mềm. D: rất thấp. Z: rất thấp, giới hạn đến 0,5MPa. U: đánh giá bằng kinh nghiệm.","w":{"b":"D là rất thấp. Mức cao là A.","c":"Z giới hạn 0,5MPa. Không hạn chế là W.","d":"F là mặt đường mềm và U là kinh nghiệm."},"t":"512"},{"s":5,"u":"Giải mã PCN và so sánh ACN với PCN","n":"513","q":"Một mặt đường công bố PCN 95/R/A/X/T. Nền đất của mặt đường này có hệ số nền K trong khoảng nào?","o":["K trong khoảng 60 đến 120MN/m3","K nhỏ hơn 25MN/m3","K trong khoảng 25 đến 60MN/m3","K lớn hơn 120MN/m3"],"a":[3],"e":"Chữ R là mặt đường cứng, dùng trị số hệ số nền K. Chữ A là cường độ cao, K = 150MN/m3, lớn hơn 120.","w":{"a":"Khoảng này ứng với chữ B.","b":"Khoảng này ứng với chữ D.","c":"Khoảng này ứng với chữ C."},"t":"513"},{"s":5,"u":"Giải mã PCN và so sánh ACN với PCN","n":"514","q":"Trong chuỗi PCN 70/F/A/X/U, chữ X nằm ở cột nào của bảng ACN-PCN?","o":["Cột cường độ chịu lực","Cột phương pháp đánh giá","Cột loại mặt đường","Cột áp suất bánh (trung bình, giới hạn đến 1,5MPa)"],"a":[3],"e":"Chuỗi sắp xếp theo thứ tự các cột: loại mặt đường (F), cường độ chịu lực (A), áp suất bánh (X), phương pháp đánh giá (U).","w":{"a":"Cột này dùng chữ A, B, C, D.","b":"Cột này dùng chữ T và U.","c":"Cột này dùng chữ R và F."},"t":"514"},{"s":5,"u":"Giải mã PCN và so sánh ACN với PCN","n":"515","q":"Nguyên tắc chung của phương pháp ACN-PCN: tàu bay có thể khai thác không hạn chế trên mặt đường khi nào?","o":["Khi ACN của tàu bay không lớn hơn PCN của mặt đường","Khi hai chỉ số khác loại mặt đường","Khi tàu bay thuộc mã chữ F","Khi ACN của tàu bay lớn hơn PCN của mặt đường"],"a":[0],"e":"ACN là chỉ số phân cấp tàu bay, PCN là chỉ số phân cấp mặt đường. Tàu bay có ACN không lớn hơn PCN thì mặt đường chịu được. Nguyên tắc này thuộc phương pháp chung của ICAO, file chỉ nêu tên phương pháp.","w":{"b":"Việc so sánh dựa trên giá trị của hai chỉ số, không dựa trên loại mặt đường.","c":"Mã chữ F là cách phân cấp sân bay theo sải cánh, không liên quan đến so sánh ACN và PCN.","d":"Khi ACN lớn hơn PCN, mặt đường chịu tải kém hơn mức tàu bay đòi hỏi."},"t":"515"},{"s":5,"u":"Giải mã PCN và so sánh ACN với PCN","n":"516","q":"Một tàu bay có ACN 48 khai thác trên mặt đường có PCN 60 (cùng điều kiện nền). Kết luận nào hợp lý?","o":["Mặt đường đáp ứng, vì ACN và PCN phải bằng nhau","Mặt đường đáp ứng, vì ACN nhỏ hơn PCN","Mặt đường không đáp ứng, vì ACN nhỏ hơn PCN","Không kết luận được vì chưa biết sải cánh"],"a":[1],"e":"Theo nguyên tắc ACN không lớn hơn PCN: 48 nhỏ hơn 60 nên mặt đường đáp ứng.","w":{"a":"Chỉ cần ACN không lớn hơn PCN, không cần bằng nhau.","c":"ACN nhỏ hơn PCN nghĩa là mặt đường chịu được tải của tàu bay.","d":"Sải cánh liên quan đến mã chữ, không liên quan so sánh ACN và PCN."},"t":"516"},{"s":5,"u":"Giải mã PCN và so sánh ACN với PCN","n":"517","q":"Một tàu bay có ACN 75 khai thác trên mặt đường có PCN 60. Kết luận nào hợp lý?","o":["Mặt đường chưa đáp ứng, cần hạn chế hoặc xem xét điều kiện khai thác","Mặt đường đáp ứng, vì 75 lớn hơn 60","Mặt đường đáp ứng, vì sải cánh nhỏ","Mặt đường đáp ứng sau khi đổi sang mã chữ khác"],"a":[0],"e":"ACN 75 lớn hơn PCN 60 nên tải của tàu bay vượt mức chịu tải công bố của mặt đường.","w":{"b":"Giá trị ACN lớn hơn cho thấy tàu bay nặng hơn khả năng của mặt đường.","c":"Sải cánh không dùng để so sánh ACN và PCN.","d":"Mã chữ của sân bay không làm đổi sức chịu tải mặt đường."},"t":"517"},{"s":5,"u":"Mã IATA và ICAO của sân bay","n":"518","q":"Hành khách thấy ký hiệu SGN trên vé máy bay. Kiểm soát viên không lưu thường dùng mã nào của cùng sân bay?","o":["Mã IATA 3 chữ cái","Mã IATA 4 chữ cái","Mã ICAO 4 chữ cái","Mã ICAO 3 chữ cái"],"a":[2],"e":"Mã IATA 3 chữ cái dùng trong thương mại, trên lịch bay của hãng. Mã ICAO 4 chữ cái dùng chủ yếu trong bảo đảm hoạt động bay.","w":{"a":"SGN đã là mã IATA, dùng trên lịch bay và vé.","b":"Mã IATA chỉ gồm 3 chữ cái.","d":"Mã ICAO gồm 4 chữ cái."},"t":"518"},{"s":5,"u":"Mã IATA và ICAO của sân bay","n":"519","q":"Mã nào dưới đây là mã sân bay theo ICAO?","o":["SGN","DAD","VVNB","HAN"],"a":[2],"e":"Mã ICAO gồm 4 chữ cái. VVNB là mã ICAO của Nội Bài, còn HAN, SGN, DAD là mã IATA 3 chữ cái.","w":{"a":"Mã 3 chữ cái là mã IATA.","b":"Mã 3 chữ cái là mã IATA.","d":"Mã 3 chữ cái là mã IATA."},"t":"519"},{"s":5,"u":"Mã IATA và ICAO của sân bay","n":"520","q":"Mã VVTS gồm bốn ký tự. Hai ký tự đầu VV cho biết điều gì theo công thức trong file?","o":["Khu vực Việt Nam, quốc gia Thái Lan","Tên viết tắt của sân bay Tân Sơn Nhất","Quốc gia Vietnam, khu vực Bắc Âu","Khu vực Nam Á và Đông Nam Á lục địa (V), quốc gia Vietnam (V)"],"a":[3],"e":"Ký tự đầu V là khu vực (Many South Asian countries, mainland Southeast Asia). Ký tự thứ hai V cùng ký tự đầu tạo VV là Vietnam. Hai ký tự cuối TS là tên viết tắt của sân bay.","w":{"a":"Thái Lan dùng mã VT, không dùng VV.","b":"Tên viết tắt của sân bay nằm ở hai ký tự cuối (TS).","c":"Chữ V đầu thuộc khu vực Nam Á và Đông Nam Á lục địa. Bắc Âu dùng chữ E."},"t":"520"},{"s":5,"u":"Mã IATA và ICAO của sân bay","n":"521","q":"Mã ICAO VVNB: hai ký tự cuối NB tượng trưng cho điều gì theo công thức của file?","o":["Quốc gia Việt Nam","Tên viết tắt của sân bay Nội Bài","Khu vực Đông Nam Á","Mã IATA của sân bay"],"a":[1],"e":"Hai ký tự cuối là tên viết tắt của sân bay (NB là Nội Bài). VV là Vietnam.","w":{"a":"Quốc gia do ký tự thứ hai thể hiện, ở đây VV là Vietnam.","c":"Khu vực do ký tự đầu thể hiện, ở đây là V.","d":"Mã IATA của Nội Bài là HAN."},"t":"521"},{"s":5,"u":"Mã IATA và ICAO của sân bay","n":"522","q":"SGN và HAN là hai sân bay của cùng một quốc gia. Mã ICAO của hai sân bay này bắt đầu bằng cặp chữ cái nào?","o":["VN","VY","VV","VT"],"a":[2],"e":"Vietnam dùng VV, nên mã ICAO của cả hai sân bay đều bắt đầu bằng VV (VVTS và VVNB).","w":{"a":"VN là mã của Nepal trong file.","b":"VY là mã của Myanmar trong file.","d":"VT là mã của Thailand trong file."},"t":"522"},{"s":5,"u":"Mã IATA và ICAO của sân bay","n":"523","q":"Một mã sân bay gồm 4 chữ cái, bắt đầu bằng WS. Dựa vào file, sân bay thuộc quốc gia nào?","o":["Indonesia","Brunei","Singapore","Malaysia"],"a":[2],"e":"Theo file, WS là Singapore (ví dụ WSSS, sân bay Changi). Chữ W thuộc nhóm Đông Nam Á hải đảo.","w":{"a":"Indonesia dùng WA, WI, WR.","b":"Brunei dùng WB.","d":"Malaysia dùng WM."},"t":"523"},{"s":5,"u":"Mã IATA và ICAO của sân bay","n":"524","q":"Điện văn cần ghi sân bay Nội Bài bằng mã dùng trong ATM. Phải ghi mã nào?","o":["HAN","NIA","VVNB","VVHN"],"a":[2],"e":"Mã ICAO (ATM) của Nội Bài là VVNB. Mã IATA thương mại là HAN.","w":{"a":"HAN là mã IATA thương mại.","b":"NIA là cách viết tắt tên tiếng Anh dùng ở ví dụ điểm quy chiếu, không phải mã sân bay của file.","d":"Hai ký tự cuối của mã ICAO Nội Bài là NB."},"t":"524"},{"s":5,"u":"Mức cao, nhiệt độ tham chiếu, điểm quy chiếu","n":"525","q":"Cao độ các điểm trên đường CHC của một sân bay là: đầu đường 12m, giữa đường 15m, cuối đường 11m. Mức cao sân bay là bao nhiêu?","o":["11m","15m","12,7m","12m"],"a":[1],"e":"File ghi mức cao sân bay là điểm cao nhất trên đường cất hạ cánh so với mực nước biển trung bình. Điểm cao nhất ở đây là 15m.","w":{"a":"Giá trị này là điểm thấp nhất.","c":"Giá trị này là trung bình ba điểm. Mức cao là điểm cao nhất.","d":"Mức cao sân bay là điểm cao nhất trên đường cất hạ cánh, không phải cao độ ở đầu đường."},"t":"525"},{"s":5,"u":"Mức cao, nhiệt độ tham chiếu, điểm quy chiếu","n":"526","q":"Đo cao độ điểm cao nhất của đường CHC được 24,3m. Giá trị thông báo cho AIS với độ chính xác đến 0,5m là bao nhiêu?","o":["24,5m","25,0m","24,3m","24,0m"],"a":[0],"e":"Với độ chính xác 0,5m, giá trị được ghi theo bội của 0,5. Giá trị gần 24,3m nhất là 24,5m.","w":{"b":"25,0m cách 24,3m tới 0,7m.","c":"Giá trị thông báo làm tròn đến bội của 0,5m.","d":"24,3m gần 24,5m hơn 24,0m. Khoảng cách tới 24,5 là 0,2m, tới 24,0 là 0,3m."},"t":"526"},{"s":5,"u":"Mức cao, nhiệt độ tham chiếu, điểm quy chiếu","n":"527","q":"Đo cao độ điểm cao nhất của đường CHC được 112,8m. Giá trị thông báo cho AIS với độ chính xác đến 0,5m là bao nhiêu?","o":["112,5m","112,8m","113,0m","114,0m"],"a":[2],"e":"Bội của 0,5m gần 112,8m nhất là 113,0m.","w":{"a":"112,8m cách 113,0m là 0,2m, cách 112,5m là 0,3m.","b":"Giá trị thông báo làm tròn đến bội của 0,5m.","d":"114,0m cách 112,8m tới 1,2m."},"t":"527"},{"s":5,"u":"Mức cao, nhiệt độ tham chiếu, điểm quy chiếu","n":"528","q":"Một sân bay có đường CHC tiếp cận chính xác. Mức cao cần được đo tại bao nhiêu vị trí theo file?","o":["4 vị trí, thêm đầu sân đỗ","1 vị trí: ngưỡng đường CHC","3 vị trí: ngưỡng đường CHC, cuối đường CHC, vị trí cao nhất khu vực chạm bánh","2 vị trí: ngưỡng đường CHC và cuối đường CHC"],"a":[2],"e":"File nêu ba vị trí đo cho đường CHC tiếp cận chính xác: ngưỡng, cuối đường CHC và vị trí cao nhất khu vực chạm bánh.","w":{"a":"File không nêu đầu sân đỗ.","b":"File nêu thêm cuối đường CHC và vị trí cao nhất khu vực chạm bánh.","d":"File nêu thêm vị trí cao nhất khu vực chạm bánh."},"t":"528"},{"s":5,"u":"Mức cao, nhiệt độ tham chiếu, điểm quy chiếu","n":"529","q":"Nhiệt độ trung bình các tháng của một sân bay: tháng 5 là 29,1°C; tháng 6 là 29,8°C; tháng 7 là 30,4°C; tháng 8 là 29,9°C. Nhiệt độ tham chiếu tính trong tháng nào?","o":["Tháng 8","Tháng 5","Tháng 6","Tháng 7"],"a":[3],"e":"File ghi tháng nóng nhất là tháng có nhiệt độ trung bình cao nhất. Tháng 7 có 30,4°C là cao nhất.","w":{"a":"Tháng 8 có nhiệt độ trung bình thấp hơn tháng 7.","b":"Tháng 5 có nhiệt độ trung bình thấp nhất trong bốn tháng.","c":"Tháng 6 không phải tháng có nhiệt độ trung bình cao nhất."},"t":"529"},{"s":5,"u":"Mức cao, nhiệt độ tham chiếu, điểm quy chiếu","n":"530","q":"Trung bình của nhiệt độ cao nhất hàng ngày trong tháng nóng nhất lần lượt là 34,2°C; 35,0°C; 33,8°C ở ba năm liên tiếp. Nhiệt độ tham chiếu (tính trung bình nhiều năm) xấp xỉ bao nhiêu?","o":["33,8°C","35,0°C","34,3°C","34,8°C"],"a":[2],"e":"File khuyến nghị tính trung bình trong nhiều năm: (34,2 + 35,0 + 33,8) / 3 = 103 / 3, xấp xỉ 34,3°C.","w":{"a":"Đây là giá trị nhỏ nhất của ba năm.","b":"Đây là giá trị lớn nhất của ba năm. Nhiệt độ tham chiếu là giá trị trung bình nhiều năm.","d":"Trung bình của ba giá trị là (34,2 + 35,0 + 33,8) / 3 = 34,3."},"t":"530"},{"s":5,"u":"Mức cao, nhiệt độ tham chiếu, điểm quy chiếu","n":"531","q":"Sân bay xây thêm nhà ga mới phía đông, cách vị trí điểm quy chiếu ban đầu 2km. Điểm quy chiếu của sân bay cần xử lý thế nào theo file?","o":["Dời xuống cuối đường lăn gần nhà ga","Giữ nguyên vị trí ban đầu đã chọn","Dời đến nhà ga mới","Dời đến tâm hình học mới của sân bay"],"a":[1],"e":"File ghi điểm quy chiếu duy trì cố định từ khi thiết lập ban đầu và không được thay đổi vị trí đã chọn.","w":{"a":"File nêu điểm quy chiếu giữ cố định từ khi thiết lập ban đầu.","c":"File không gắn điểm quy chiếu với nhà ga.","d":"File nêu nguyên tắc không được thay đổi vị trí ban đầu đã chọn."},"t":"531"},{"s":5,"u":"Mức cao, nhiệt độ tham chiếu, điểm quy chiếu","n":"532","q":"Điểm quy chiếu ghi 21°13'17,57\"N. Con số 17,57 là đơn vị nào?","o":["Độ","Giây","Mét","Phút"],"a":[1],"e":"Tọa độ WGS-84 trong file gồm độ, phút, giây. Dạng 21°13'17,57\" là 21 độ, 13 phút, 17,57 giây.","w":{"a":"Phần độ là 21.","c":"Tọa độ trong file dùng độ, phút, giây.","d":"Phần phút là 13."},"t":"532"},{"s":5,"u":"Phân loại sân bay, khai thác, hiệp đồng","n":"533","q":"Một khu vực chỉ có đường CHC, đường lăn, sân đỗ, không có nhà ga thương mại. Theo định nghĩa của file, khu vực này là gì?","o":["Nhà ga hàng không","Đường bay","Sân bay","Cảng hàng không"],"a":[2],"e":"Sân bay là khu vực xác định phục vụ tàu bay cất hạ cánh, gồm đường CHC, đường lăn, sân đỗ. Có thêm nhà ga và công trình thiết bị thì thành cảng hàng không.","w":{"a":"File định nghĩa nhà ga là thành phần thương mại của cảng hàng không.","b":"Đường bay không phải khái niệm trong định nghĩa này.","d":"Cảng hàng không còn có nhà ga (thương mại), công trình, thiết bị."},"t":"533"},{"s":5,"u":"Phân loại sân bay, khai thác, hiệp đồng","n":"534","q":"Một sân bay có mã tham chiếu 3C. Sân bay này có phù hợp để tiếp nhận A380 (nhóm 4F) không?","o":["Có, vì mã số 3 và mã chữ C đủ cho mọi tàu bay","Không, A380 cần mã số 4 và mã chữ F","Không, vì A380 thuộc nhóm 3C / 4C","Có, vì chỉ cần mã chữ C"],"a":[1],"e":"Mã 3C: đường CHC 1200-1800m, sải cánh 24-36m. A380 thuộc 4F: đường CHC trên 1800m, sải cánh 65-80m.","w":{"a":"A380 thuộc nhóm 4F, cần đường CHC dài trên 1800m và sải cánh 65-80m.","c":"A380 thuộc nhóm 4F, nhóm 3C / 4C gồm A320, A321, B737.","d":"Mã chữ C ứng với sải cánh 24-36m, nhỏ hơn sải cánh của A380."},"t":"534"},{"s":5,"u":"Phân loại sân bay, khai thác, hiệp đồng","n":"535","q":"Sân bay có đường CHC dài 2400m và khai thác tàu bay sải cánh 30m, bánh ngoài 7m. Nhóm tàu bay nào trong file có mã phân cấp phù hợp?","o":["B767, B787 (4D / 4E)","A320, A321, B737 (3C / 4C)","A380, B747-8 (4F)","Không nhóm nào"],"a":[1],"e":"Đường CHC 2400m thuộc mã số 4. Sải cánh 30m (24-36m) và bánh ngoài 7m (6-9m) thuộc mã chữ C. Nhóm 3C / 4C gồm A320, A321, B737.","w":{"a":"Mã chữ D và E ứng với sải cánh 36-65m, lớn hơn 30m.","c":"Mã chữ F ứng với sải cánh 65-80m, lớn hơn 30m.","d":"Sải cánh 30m và bánh ngoài 7m thuộc mã chữ C, trùng nhóm 3C / 4C."},"t":"535"},{"s":5,"u":"Phân loại sân bay, khai thác, hiệp đồng","n":"536","q":"Sân bay chưa có hệ thống dẫn dắt tự động. Tàu bay vừa hạ cánh cần được dẫn về vị trí đỗ. File gợi ý biện pháp nào?","o":["Dùng xe follow me kết hợp nhân viên chỉ dẫn bằng ký hiệu tay (marshalling)","Dùng hệ thống đèn hỗ trợ tiếp cận, hạ cánh","Dùng xe cấp nước sạch","Dùng dải quang"],"a":[0],"e":"File liệt kê các cách dẫn dắt: tower, bộ phận điều hành sân đỗ, xe follow me cùng marshalling, hệ thống dẫn dắt tự động. Xe follow me và marshalling trực tiếp đưa tàu bay về vị trí đỗ trên mặt đất.","w":{"b":"Hệ thống đèn này dành cho giai đoạn tiếp cận và hạ cánh.","c":"Xe cấp nước sạch là hạng mục trên sân đỗ, không dẫn dắt tàu bay.","d":"Dải quang là khu vực hỗ trợ cất cánh, không dùng để dẫn tàu bay."},"t":"536"},{"s":5,"u":"Phân loại sân bay, khai thác, hiệp đồng","n":"537","q":"Tàu bay hạ cánh vào ban đêm và cần được hỗ trợ trong giai đoạn tiếp cận. Hệ thống nào trong danh sách đèn của file được kiểm tra trước khi tối để phục vụ giai đoạn này?","o":["Hệ thống đèn hỗ trợ tiếp cận, hạ cánh","Đèn nhận dạng sân bay","Đèn báo hiệu các vật cản","Đèn đường lăn"],"a":[0],"e":"File liệt kê hệ thống đèn hỗ trợ tiếp cận, hạ cánh trong danh sách đèn cần kiểm tra trước khi tối.","w":{"b":"Đèn này giúp nhận ra sân bay.","c":"Đèn này báo hiệu các vật cản.","d":"Đèn này phục vụ tàu bay lăn trên mặt đất."},"t":"537"},{"s":5,"u":"Phân loại sân bay, khai thác, hiệp đồng","n":"538","q":"Từ ngày thống nhất vùng trời (01/01/1955) đến ngày Luật HKDDVN chính thức có hiệu lực (01/01/2007) là bao nhiêu năm?","o":["53 năm","52 năm","50 năm","51 năm"],"a":[1],"e":"Từ 01/01/1955 đến 01/01/2007 tròn 52 năm.","w":{"a":"2007 - 1955 = 52 năm.","c":"2007 - 1955 = 52 năm.","d":"51 năm là khoảng cách từ năm 1956 (thành lập Cục HKDDVN) đến 2007."},"t":"538"},{"s":5,"u":"Phân loại sân bay, khai thác, hiệp đồng","n":"539","q":"Khoảng thời gian từ ngày thành lập Cục HKDDVN (15/01/1956) đến ngày Luật HKDDVN có hiệu lực (01/01/2007) là bao nhiêu?","o":["Khoảng 45 năm","Khoảng 49 năm","Gần 51 năm","Đúng 52 năm"],"a":[2],"e":"Từ 15/01/1956 đến 15/01/2006 là 50 năm, đến 01/01/2007 thêm gần 12 tháng, nên khoảng cách là gần 51 năm.","w":{"a":"1956 đến 2007 xấp xỉ 51 năm.","b":"1956 đến 2007 xấp xỉ 51 năm.","d":"52 năm là khoảng cách từ 01/01/1955, ngày thống nhất vùng trời."},"t":"539"},{"s":5,"u":"Phân loại sân bay, khai thác, hiệp đồng","n":"540","q":"Nhà chức trách sân bay dự kiến thay đổi sơ đồ và hệ thống dẫn đường có hiệu lực vào ngày 01/12. Việc nào phù hợp với lưu ý của file?","o":["Thông báo cho AIS sớm, đủ thời gian để chuẩn bị, in ấn và phát hành đúng chu kỳ","Thông báo cho AIS vào đúng ngày 01/12","Không cần thông báo vì thay đổi mang tính nội bộ","Thông báo sau ngày 01/12 khi đã vận hành"],"a":[0],"e":"File ghi: tính đủ thời gian cho AIS chuẩn bị, in ấn, phát hành ấn phẩm; thay đổi đặc biệt quan trọng ảnh hưởng đến sơ đồ và hệ thống dẫn đường phải phát hành đúng chu kỳ.","w":{"b":"File yêu cầu tính đủ thời gian để AIS chuẩn bị, in ấn, phát hành.","c":"Thay đổi ảnh hưởng đến sơ đồ và hệ thống dẫn đường phải phát hành đúng chu kỳ.","d":"Thông tin phải có trước khi thay đổi có hiệu lực."},"t":"540"},{"s":5,"u":"Phân loại sân bay, khai thác, hiệp đồng","n":"541","q":"Phi công báo cáo một cột ăng-ten mới xuất hiện gần đường CHC. Thông tin này thuộc loại nào trong phần hiệp đồng với AIS?","o":["Chất lượng dữ liệu","Chu kỳ phát hành","Tình trạng khai thác của sân bay","Cảnh báo và tin tức quan trọng (chướng ngại vật)"],"a":[3],"e":"Chướng ngại vật do kiểm soát viên không lưu quan sát hoặc tàu bay báo cáo thuộc loại \"Cảnh báo & tin tức quan trọng\".","w":{"a":"Chất lượng dữ liệu là lưu ý về độ chính xác và toàn vẹn.","b":"Chu kỳ phát hành là lưu ý về thời điểm phát hành, không phải loại thông tin.","c":"Phần này nêu tình trạng sân bay, dịch vụ, hệ thống kỹ thuật, thiết bị dẫn đường."},"t":"541"},{"s":5,"u":"Phân loại sân bay, khai thác, hiệp đồng","n":"542","q":"Một đài dẫn đường trong khu vực trách nhiệm ngừng hoạt động để bảo dưỡng. Thông tin này thuộc loại nào trong phần hiệp đồng với AIS?","o":["Cảnh báo chướng ngại vật","Tình trạng khai thác (thiết bị dẫn đường liên quan)","Chu kỳ phát hành","Điểm quy chiếu sân bay"],"a":[1],"e":"File ghi tình trạng khai thác gồm thiết bị dẫn đường liên quan trong khu vực trách nhiệm.","w":{"a":"Đài ngừng hoạt động là tình trạng thiết bị, không phải chướng ngại vật.","c":"Chu kỳ phát hành là lưu ý về thời điểm phát hành.","d":"Điểm quy chiếu là vị trí địa lý cố định của sân bay."},"t":"542"},{"s":5,"u":"Phân loại sân bay, khai thác, hiệp đồng","n":"543","q":"Nhà chức trách sân bay gửi cho AIS dữ liệu độ cao sai lệch lớn so với thực tế. Lưu ý nào của file bị vi phạm?","o":["Đảm bảo chất lượng dữ liệu (độ chính xác và tính toàn vẹn)","Hiệp đồng kịp thời","Tuân thủ chu kỳ phát hành","Đảm bảo thời gian chuẩn bị"],"a":[0],"e":"Nhà chức trách sân bay chịu trách nhiệm cung cấp tin tức, dữ liệu đạt chuẩn về độ chính xác và tính toàn vẹn.","w":{"b":"Lưu ý này nói về việc cung cấp thông tin đúng lúc.","c":"Lưu ý này nói về thời điểm phát hành.","d":"Lưu ý này nói về thời gian để AIS chuẩn bị, in ấn, phát hành."},"t":"543"},{"s":5,"u":"Mã ICAO của sân bay Việt Nam","n":"544","q":"Sân bay Tân Sơn Nhất có mã IATA là SGN. Mã ICAO 4 chữ cái của sân bay này là gì?","o":["VYTS","VVCI","VVCR","VVTS"],"a":[3],"e":"Mã ICAO của sân bay Tân Sơn Nhất là VVTS. Hai ký tự đầu VV là Vietnam theo file, hai ký tự cuối TS là tên viết tắt của sân bay.","w":{"a":"Mã bắt đầu bằng VY, là mã của Myanmar trong file. Sân bay Việt Nam bắt đầu bằng VV.","b":"VVCI là mã ICAO của sân bay Cát Bi (HPH).","c":"VVCR là mã ICAO của sân bay Cam Ranh (CXR)."},"t":"544"},{"s":5,"u":"Mã ICAO của sân bay Việt Nam","n":"545","q":"Sân bay Nội Bài có mã IATA là HAN. Mã ICAO 4 chữ cái của sân bay này là gì?","o":["VVDL","VYNB","VVDN","VVNB"],"a":[3],"e":"Mã ICAO của sân bay Nội Bài là VVNB. Hai ký tự đầu VV là Vietnam theo file, hai ký tự cuối NB là tên viết tắt của sân bay.","w":{"a":"VVDL là mã ICAO của sân bay Liên Khương (DLI).","b":"Mã bắt đầu bằng VY, là mã của Myanmar trong file. Sân bay Việt Nam bắt đầu bằng VV.","c":"VVDN là mã ICAO của sân bay Đà Nẵng (DAD)."},"t":"545"},{"s":5,"u":"Mã ICAO của sân bay Việt Nam","n":"546","q":"Sân bay Đà Nẵng có mã IATA là DAD. Mã ICAO 4 chữ cái của sân bay này là gì?","o":["VVDN","VVPQ","VVNB","VYDN"],"a":[0],"e":"Mã ICAO của sân bay Đà Nẵng là VVDN. Hai ký tự đầu VV là Vietnam theo file, hai ký tự cuối DN là tên viết tắt của sân bay.","w":{"b":"VVPQ là mã ICAO của sân bay Phú Quốc (PQC).","c":"VVNB là mã ICAO của sân bay Nội Bài (HAN).","d":"Mã bắt đầu bằng VY, là mã của Myanmar trong file. Sân bay Việt Nam bắt đầu bằng VV."},"t":"546"},{"s":5,"u":"Mã ICAO của sân bay Việt Nam","n":"547","q":"Sân bay Cam Ranh có mã IATA là CXR. Mã ICAO 4 chữ cái của sân bay này là gì?","o":["VYCR","VVCR","VVCT","VVDN"],"a":[1],"e":"Mã ICAO của sân bay Cam Ranh là VVCR. Hai ký tự đầu VV là Vietnam theo file, hai ký tự cuối CR là tên viết tắt của sân bay.","w":{"a":"Mã bắt đầu bằng VY, là mã của Myanmar trong file. Sân bay Việt Nam bắt đầu bằng VV.","c":"VVCT là mã ICAO của sân bay Cần Thơ (VCA).","d":"VVDN là mã ICAO của sân bay Đà Nẵng (DAD)."},"t":"547"},{"s":5,"u":"Mã ICAO của sân bay Việt Nam","n":"548","q":"Sân bay Phú Quốc có mã IATA là PQC. Mã ICAO 4 chữ cái của sân bay này là gì?","o":["VVCI","VYPQ","VVPQ","VVCR"],"a":[2],"e":"Mã ICAO của sân ba <script>
(function(){
"use strict";
const LET="ABCDE";
const app=document.getElementById("app");

const store={
  get(k){try{return localStorage.getItem(k)}catch(e){return null}},
  set(k,v){try{localStorage.setItem(k,v)}catch(e){}},
  del(k){try{localStorage.removeItem(k)}catch(e){}}
};
const SETS=Array.from(new Set(DATA.map(q=>q.s))).sort((a,b)=>a-b);

const SHORT={1:"Chương I",2:"Chương II",3:"Chương II",4:"Chương II",5:"Vận dụng"};
const TOPIC={1:"Tổng quan về sân bay",2:"Điểm quy chiếu, mã IATA và ICAO, mức cao, nhiệt độ",3:"Mã ICAO theo khu vực và quốc gia",4:"Sức chịu tải, cự ly công bố, hiệp đồng với AIS",5:"Câu ngoài file: tính toán và suy luận"};
const countOf=s=>DATA.filter(q=>q.s===s).length;
const FLAGGED=DATA.filter(q=>q.f).length;
const LOGO='<svg width="30" height="30" viewBox="0 0 30 30" aria-hidden="true"><circle cx="15" cy="15" r="12" fill="none" stroke="#7db4ff" stroke-width="2"/><circle cx="15" cy="15" r="6" fill="none" stroke="#7db4ff" stroke-width="1.6" opacity=".7"/><path d="M15 15L24.5 8.5A12 12 0 0 1 27 15z" fill="#2468e0"/><path d="M15 15L24.5 8.5" stroke="#f2f6ff" stroke-width="2" stroke-linecap="round"/><circle cx="15" cy="15" r="1.8" fill="#f2f6ff"/></svg>';

let prefs={};
try{prefs=JSON.parse(store.get("sanbay:prefs1")||"{}")||{}}catch(e){prefs={}}
let hist={};
try{hist=JSON.parse(store.get("sanbay:hist1")||"{}")||{}}catch(e){hist={}}
const savePrefs=()=>store.set("sanbay:prefs1",JSON.stringify({sets:Array.from(S.sets),shuffle:S.shuffle,limit:S.limit}));
const saveHist=()=>store.set("sanbay:hist1",JSON.stringify(hist));

const S={
  screen:"home",
  sets:new Set(Array.isArray(prefs.sets)?prefs.sets.filter(x=>SETS.includes(x)):SETS),
  shuffle:!!prefs.shuffle,
  limit:[0,20,50].includes(prefs.limit)?prefs.limit:0,
  round:1,queue:[],pos:0,res:{},correct:0,streak:0,best:0,pick:new Set(),done:false,base:null,arm:false
};

const shuffled=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
const pool=()=>{const r=[];DATA.forEach((q,i)=>{if(S.sets.has(q.s))r.push(i)});return r};
const sessionSize=()=>{const n=pool().length;return S.limit&&S.limit<n?S.limit:n};
function buildQueue(){
  let l=pool();
  if(S.limit&&S.limit<l.length){l=shuffled(l).slice(0,S.limit);if(!S.shuffle)l.sort((a,b)=>a-b)}
  else if(S.shuffle)l=shuffled(l);
  return l;
}
function startRound(list,round){
  S.round=round;S.queue=list.slice();S.pos=0;S.res={};S.correct=0;S.streak=0;
  S.pick=new Set();S.done=false;S.screen="quiz";render();window.scrollTo(0,0);
}
const sameSet=(a,pick)=>pick.size===a.length&&a.every(k=>pick.has(k));
function matched(q,pick){
  if(sameSet(q.a,pick))return q.a;
  const alts=q.alt||[];
  for(let i=0;i<alts.length;i++)if(sameSet(alts[i],pick))return alts[i];
  return null;
}
function finalize(reveal){
  const idx=S.queue[S.pos],q=DATA[idx];if(S.done)return;
  const m=reveal?null:matched(q,S.pick),ok=!!m;
  S.done=true;
  S.res[idx]={ok,set:m||q.a,pick:Array.from(S.pick).sort((a,b)=>a-b)};
  if(ok){S.correct++;S.streak++;S.best=Math.max(S.best,S.streak)}else S.streak=0;
  hist[idx]=ok?1:0;saveHist();
  render();
  const ex=document.getElementById("ex");
  if(ex&&ex.scrollIntoView){
    const calm=window.matchMedia&&window.matchMedia("(prefers-reduced-motion: reduce)").matches;
    ex.scrollIntoView({block:"nearest",behavior:calm?"auto":"smooth"});
  }
}
function topbar(){
  const quiz=S.screen==="quiz";
  const prog=quiz?Math.round((S.pos+(S.done?1:0))/S.queue.length*100):0;
  return '<header class="top'+(quiz?" quiz":"")+'"><div class="in"><div class="brand">'+LOGO+'<span>Sân bay</span></div>'+
    (quiz?'<span class="pill">Đúng <b>'+S.correct+'</b>/'+Object.keys(S.res).length+'</span><span class="pill">Chuỗi '+S.streak+'</span>'+(S.round>1?'<span class="pill">Lượt '+S.round+'</span>':"")+'<button class="link" data-act="home">Thoát</button>':"")+
    '</div>'+(quiz?'<div class="bar"><i style="width:'+prog+'%"></i></div>':"")+'</header>';
}
function setStats(s){
  let t=0,d=0,w=0;
  DATA.forEach((q,i)=>{if(q.s===s){t++;if(hist[i]===1)d++;else if(hist[i]===0)w++}});
  return {t,d,w};
}
function savedWrong(){const r=[];DATA.forEach((q,i)=>{if(hist[i]===0)r.push(i)});return r}
function renderHome(){
  const n=sessionSize(),sw=savedWrong().length;
  const done=Object.keys(hist).filter(k=>DATA[k]).length;
  const tiles=SETS.map(s=>{
    const st=setStats(s);
    const label='<small>Phần</small>'+s;
    return '<button class="set" data-act="set" data-s="'+s+'" aria-pressed="'+S.sets.has(s)+'" aria-label="'+setName(s)+', '+st.t+' câu">'+
      '<span class="sn">'+label+'</span><span class="sc"><b>'+SHORT[s]+'</b>'+(TOPIC[s]||"")+'<br>'+st.t+' câu</span>'+
      '<span class="pb"><i class="g" style="width:'+(st.d/st.t*100)+'%"></i><i class="r" style="width:'+(st.w/st.t*100)+'%"></i></span>'+
      '<span class="sm">'+((st.d+st.w)?'đúng '+st.d+' · sai '+st.w:'')+'</span></button>';
  }).join("");
  const lone="";
  app.innerHTML=topbar()+'<main class="wrap">'+
  '<section class="hero"><div class="eyebrow">Trắc nghiệm có giải thích</div><h1>Ôn tập <span class="nb">Sân bay</span></h1>'+
  '<p>Trọn bộ 586 câu cho hai file Sân bay: Chương I Tổng quan về sân bay và Chương II Dữ liệu sân bay. Bốn phần đầu đi theo từng dòng của hai file, phần 5 là câu vận dụng ngoài file. Mỗi câu có lời giải thích và lý do cho từng phương án sai. Các câu làm sai được lưu để làm lại.</p>'+
  '<div class="facts"><div class="fact"><b>'+DATA.length+'</b><span>câu hỏi</span></div><div class="fact"><b>'+SETS.length+'</b><span>phần</span></div><div class="fact"><b>'+done+'</b><span>câu đã làm</span></div><div class="fact"><b>'+sw+'</b><span>câu đang sai</span></div></div></section>'+
  '<h2><i>1</i>Chọn phần</h2><div class="sets">'+tiles+'</div>'+
  '<div class="row"><button class="link" data-act="all">Chọn tất cả</button><button class="link" data-act="none">Bỏ chọn</button></div>'+
  '<h2><i>2</i>Tùy chọn</h2>'+
  '<div class="opts-row"><div><div class="lab" id="lm">Số câu mỗi lượt</div><div class="seg" role="group" aria-labelledby="lm" style="margin-top:6px">'+
  [[0,"Tất cả"],[20,"20 câu"],[50,"50 câu"]].map(x=>'<button data-act="limit" data-n="'+x[0]+'" aria-pressed="'+(S.limit===x[0])+'">'+x[1]+'</button>').join("")+'</div></div>'+
  '<label class="tog"><input type="checkbox" data-act="shuffle" '+(S.shuffle?"checked":"")+'> Trộn thứ tự câu hỏi</label></div>'+
  '<div class="row" style="margin-top:26px"><button class="btn pri big" data-act="start" '+(n?"":"disabled")+'>Bắt đầu · '+n+' câu</button>'+
  (sw?'<button class="btn" data-act="saved">Ôn '+sw+' câu sai đã lưu</button>':"")+'</div>'+
  '<p class="note">Bốn phần đầu phủ toàn bộ 258 dòng của hai file: mỗi dòng, mỗi ý của bảng và mỗi mốc ngày đều có ít nhất một câu hỏi. Phần 5 là câu vận dụng, dùng định nghĩa và bảng trong file để tính cự ly, giải mã PCN, đọc mã ICAO.</p>'+'<p class="note">Điểm luôn tính theo nội dung trong file. '+FLAGGED+' câu có ô “Lưu ý về đáp án” vì file ghi khác với danh sách mã của ICAO (LP, OR, ZM, chữ P), in sai tên ACN, in dở trị số CBR của hạng D, hoặc làm mất dấu độ và dấu thập phân của tọa độ.</p>'+'<p class="note">Lỗi chính tả trong file (Ameria, mailand, Saudia, Ghane, Timo-Leste, đườngHCC) được sửa trong các phương án. Hai dòng chỉ có tiêu đề trong file là mục IV “Các bộ phận của sân bay” và “Mã IATA / ICAO của các sân bay thường gặp”.</p>'+lone+
  (done?'<div class="row"><button class="link" data-act="reset">'+(S.arm?'Bấm lần nữa để xóa toàn bộ lịch sử làm bài':'Xóa lịch sử làm bài')+'</button></div>':"")+
  '</main>';
}
function dockHtml(q,r){
  const multi=q.a.length>1;
  if(S.done){
    const acc=[q.a].concat(q.alt||[]).filter(s=>s!==r.set);
    const alt=acc.length?' (cũng chấp nhận: '+acc.map(s=>s.map(k=>LET[k]).join(", ")).join(" hoặc ")+')':"";
    const last=S.pos+1>=S.queue.length;
    return '<div class="vd '+(r.ok?"ok":"bad")+'"><b>'+(r.ok?"✓ Chính xác":"✕ Chưa đúng")+'</b><span>Đáp án: '+r.set.map(k=>LET[k]).join(", ")+alt+'</span></div>'+
      '<button class="btn pri" data-act="next" id="nextbtn">'+(last?"Xem kết quả":"Câu tiếp theo")+'</button>';
  }
  if(multi)return '<div class="vd"><span id="pc">Đã chọn '+S.pick.size+'/'+q.a.length+'</span></div><button class="btn" data-act="reveal">Xem đáp án</button><button class="btn pri" data-act="confirm" id="cfm" '+(S.pick.size?"":"disabled")+'>Xác nhận</button>';
  return '<div class="vd"><span>Chọn một đáp án</span></div><button class="btn" data-act="reveal">Xem đáp án</button>';
}
function renderQuiz(){
  const idx=S.queue[S.pos],q=DATA[idx],multi=q.a.length>1,r=S.res[idx];
  let opts;
  if(!S.done){
    opts=q.o.map((o,k)=>'<button class="opt'+(S.pick.has(k)?" sel":"")+'" data-act="opt" data-k="'+k+'" aria-pressed="'+S.pick.has(k)+'"><span class="lt">'+LET[k]+'</span><span class="ob"><span class="ot">'+esc(o)+'</span></span></button>').join("");
  }else{
    opts=q.o.map((o,k)=>{
      const isAns=r.set.includes(k),picked=r.pick.includes(k);
      const cls=isAns?(picked||!multi?"ok":"ok miss"):(picked?"bad":"");
      let tg="";
      if(isAns&&picked)tg='✓ Bạn chọn đúng';
      else if(isAns)tg=multi?'✓ Đáp án đúng, bạn chưa chọn':'✓ Đáp án đúng';
      else if(picked)tg='✕ Bạn đã chọn';
      const note=q.w&&q.w[LET[k].toLowerCase()];
      return '<div class="opt '+cls+'" role="listitem"><span class="lt">'+LET[k]+'</span><span class="ob"><span class="ot">'+esc(o)+'</span>'+(tg?'<span class="tg">'+tg+'</span>':"")+(note?'<span class="on">'+esc(note)+'</span>':"")+'</span></div>';
    }).join("");
  }
  const after=S.done?'<section class="ex" id="ex"><h3>Giải thích</h3><p>'+esc(q.e)+'</p></section>'+(q.f?'<section class="flag"><h3>Lưu ý về đáp án</h3><p>'+esc(q.f)+'</p></section>':""):"";
  const where=SHORT[q.s]+' · '+esc(q.u);
  app.innerHTML=topbar()+'<main class="wrap q"><article class="qcard"><div class="tag">Câu '+(S.pos+1)+'/'+S.queue.length+' · '+where+'</div><p class="qt">'+esc(q.q)+'</p>'+
    (multi?'<span class="chip">Chọn đủ '+q.a.length+' đáp án rồi bấm Xác nhận</span>':"")+
    '<div class="opts"'+(S.done?' role="list"':"")+'>'+opts+'</div>'+after+'</article><p class="kb">Phím tắt: A–D hoặc 1–4 để chọn, Enter để tiếp tục</p></main>'+
    '<div class="dock"><div class="dk" role="status">'+dockHtml(q,r)+'</div></div>';
  if(S.done){const nb=document.getElementById("nextbtn");if(nb&&nb.focus)nb.focus({preventScroll:true})}
}
const wrongList=()=>S.queue.filter(i=>S.res[i]&&!S.res[i].ok);
function renderResult(){
  const total=S.queue.length,w=wrongList(),pct=Math.round(S.correct/total*100);
  if(S.round===1)S.base={c:S.correct,t:total};
  const C=2*Math.PI*52;
  const items=w.map(i=>{
    const q=DATA[i],p=S.res[i].pick,rs=S.res[i].set;
    const mine=p.length?p.map(k=>LET[k]+". "+esc(q.o[k])).join("; "):"(chưa chọn)";
    return '<details><summary>Câu '+esc(q.n)+': '+esc(q.q.length>90?q.q.slice(0,90)+"…":q.q)+'</summary><p>'+esc(q.q)+'</p>'+
      '<p>Bạn chọn: <b class="bd">'+mine+'</b></p><p>Đáp án đúng: <b class="gd">'+rs.map(k=>LET[k]+". "+esc(q.o[k])).join("; ")+'</b></p><p>'+esc(q.e)+'</p>'+(q.f?'<p><b>Lưu ý:</b> '+esc(q.f)+'</p>':"")+'</details>';
  }).join("");
  const head=(!w.length&&S.round>1)?"Đã sửa hết các câu sai":"Kết quả lượt "+S.round;
  app.innerHTML=topbar()+'<main class="wrap"><section class="score" role="status"><div class="eyebrow">'+head+'</div>'+
    '<svg class="ring" viewBox="0 0 120 120" role="img" aria-label="'+pct+'% chính xác"><circle class="rt" cx="60" cy="60" r="52"/><circle class="rv'+(pct<50?" low":"")+'" cx="60" cy="60" r="52" transform="rotate(-90 60 60)" stroke-dasharray="'+(C*pct/100).toFixed(1)+' '+C.toFixed(1)+'"/><text class="rp" x="60" y="60">'+pct+'%</text></svg>'+
    '<div class="sc2">'+S.correct+'<small>/'+total+' câu đúng</small></div>'+
    '<div class="sub2">'+(w.length?'Còn '+w.length+' câu cần làm lại':'Không còn câu sai trong lượt này')+'</div>'+
    '<div class="stats"><span class="pill">Sai '+w.length+'</span><span class="pill">Chuỗi đúng dài nhất '+S.best+'</span>'+((S.round>1&&S.base)?'<span class="pill">Lượt đầu '+S.base.c+'/'+S.base.t+'</span>':"")+'</div>'+
    '<div class="row" style="justify-content:center;margin-top:22px">'+(w.length?'<button class="btn pri big" data-act="redo-wrong">Làm lại '+w.length+' câu sai</button>':"")+'<button class="btn" data-act="redo-all">Làm lại toàn bộ</button><button class="btn" data-act="home">Về trang chủ</button></div></section>'+
    (w.length?'<h2>Các câu làm sai</h2><div class="wl">'+items+'</div>':"")+'</main>';
}
function render(){if(S.screen==="home")renderHome();else if(S.screen==="quiz")renderQuiz();else renderResult()}
function next(){
  if(!S.done)return;
  S.pos++;S.pick=new Set();S.done=false;
  if(S.pos>=S.queue.length)S.screen="result";
  render();window.scrollTo(0,0);
}
function updateMulti(q){
  const pc=document.getElementById("pc"),cf=document.getElementById("cfm");
  if(pc)pc.textContent="Đã chọn "+S.pick.size+"/"+q.a.length;
  if(cf)cf.disabled=!S.pick.size;
  app.querySelectorAll('[data-act="opt"]').forEach(b=>{
    const on=S.pick.has(+b.getAttribute("data-k"));
    b.classList.toggle("sel",on);b.setAttribute("aria-pressed",on);
  });
}
function choose(k){
  const q=DATA[S.queue[S.pos]];if(S.done)return;
  if(q.a.length>1){if(S.pick.has(k))S.pick.delete(k);else S.pick.add(k);updateMulti(q)}
  else{S.pick=new Set([k]);finalize(false)}
}
function startMain(){S.best=0;S.base=null;startRound(buildQueue(),1)}
app.addEventListener("click",e=>{
  const el=e.target.closest("[data-act]");if(!el)return;
  const a=el.getAttribute("data-act");
  if(a!=="reset"&&S.arm){S.arm=false}
  if(a==="set"){
    const s=+el.getAttribute("data-s");
    if(S.sets.has(s))S.sets.delete(s);else S.sets.add(s);
    savePrefs();renderHome();
    const again=app.querySelector('[data-act="set"][data-s="'+s+'"]');if(again&&again.focus)again.focus();
  }
  else if(a==="all"){S.sets=new Set(SETS);savePrefs();renderHome()}
  else if(a==="none"){S.sets=new Set();savePrefs();renderHome()}
  else if(a==="limit"){S.limit=+el.getAttribute("data-n");savePrefs();renderHome()}
  else if(a==="start")startMain();
  else if(a==="saved"){S.best=0;S.base=null;const l=savedWrong();startRound(S.shuffle?shuffled(l):l,1)}
  else if(a==="reset"){
    if(S.arm){hist={};store.del("sanbay:hist1");S.arm=false}else S.arm=true;
    renderHome();
  }
  else if(a==="home"){S.screen="home";render();window.scrollTo(0,0)}
  else if(a==="opt")choose(+el.getAttribute("data-k"));
  else if(a==="confirm"){if(S.pick.size)finalize(false)}
  else if(a==="reveal")finalize(true);
  else if(a==="next")next();
  else if(a==="redo-wrong")startRound(wrongList(),S.round+1);
  else if(a==="redo-all")startMain();
});
app.addEventListener("change",e=>{
  if(e.target&&e.target.getAttribute&&e.target.getAttribute("data-act")==="shuffle"){S.shuffle=e.target.checked;savePrefs()}
});
document.addEventListener("keydown",e=>{
  if(S.screen!=="quiz"||e.ctrlKey||e.metaKey||e.altKey)return;
  const q=DATA[S.queue[S.pos]];
  if(e.key==="Enter"){
    if(S.done){e.preventDefault();next()}
    else if(q.a.length>1&&S.pick.size){e.preventDefault();finalize(false)}
    return;
  }
  if(e.key.length!==1||S.done)return;
  let k=LET.indexOf(e.key.toUpperCase());
  if(k<0&&e.key>="1"&&e.key<="5")k=+e.key-1;
  if(k>=0&&k<q.o.length)choose(k);
});
render();
})();
</script>

</body></html>
