<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Quiz Sân bay</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
/* Bố cục: một cột tối đa 860px, thanh trạng thái dính trên cùng, thanh hành động dính dưới cùng khi làm bài.
   Giao diện cố định một tông xanh dương tối, lời giải thích hiện ngay trong từng phương án sau khi trả lời. */
:root{
  --bg:#0b2150;
  --bg-deep:#071a42;
  --card:#12306f;
  --card-hi:#1a4090;
  --line:#2a54ad;
  --line-soft:#1f438f;
  --ink:#f2f6ff;
  --mute:#b4c6ec;
  --acc:#5aa2ff;
  --acc-fill:#2468e0;
  --acc-fill-hi:#3a7bf0;
  --acc-line:#7db4ff;
  --on-acc:#ffffff;
  --ok:#7df0b0;
  --ok-bg:#0d4636;
  --ok-line:#2bbf84;
  --on-ok:#04261b;
  --bad:#ffb4bc;
  --bad-bg:#561a32;
  --bad-line:#ff6b7d;
  --on-bad:#2b0710;
  --warn:#ffd98a;
  --glow-a:rgba(90,162,255,.22);
  --glow-b:rgba(36,104,224,.18);
  --font:"Be Vietnam Pro",system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  color-scheme:dark;
}
*,*::before,*::after{box-sizing:border-box}
html{background:var(--bg);scroll-padding-top:calc(env(safe-area-inset-top,0px) + 76px)}
body{margin:0;min-height:100vh;background-color:var(--bg);background-image:radial-gradient(900px 420px at 88% -120px,var(--glow-a),transparent 70%),radial-gradient(760px 380px at -12% 36%,var(--glow-b),transparent 70%);background-repeat:no-repeat;color:var(--ink);font:16px/1.6 var(--font);-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--bg-deep);z-index:20}
button{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--warn);outline-offset:2px}
h1,h2,h3,p{margin:0}

.wrap{max-width:860px;margin:0 auto;padding-block:0 64px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.wrap.q{padding-block:0 120px}

/* thanh trên */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:21;background:var(--bg-deep);border-bottom:1px solid var(--line-soft)}
.top .in{max-width:860px;margin:0 auto;padding-block:10px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-wrap:wrap;align-items:center;gap:8px 10px}
.brand{display:flex;align-items:center;gap:10px;font-weight:800;margin-right:auto;min-width:0}
.brand svg{flex:none}
.brand span{overflow-wrap:anywhere}
.pill{background:var(--card);border:1px solid var(--line-soft);border-radius:999px;padding:3px 12px;font-size:.85rem;font-weight:600;white-space:nowrap;font-variant-numeric:tabular-nums}
.pill b{color:var(--ok)}
.bar{height:5px;background:var(--card)}
.bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--acc-fill),var(--acc));transition:width .3s}
.link{background:none;border:0;color:var(--acc);cursor:pointer;padding:4px 2px;text-decoration:underline;font-size:.9rem}

/* trang chủ */
.hero{padding-top:38px}
.eyebrow{color:var(--acc);font-weight:700;font-size:.8rem;letter-spacing:.12em;text-transform:uppercase;margin-bottom:10px}
.hero h1{font-size:clamp(1.9rem,6vw,3rem);line-height:1.12;font-weight:800}
.nb{white-space:nowrap}
.hero p{color:var(--mute);max-width:58ch;margin-top:14px}
.facts{display:grid;grid-template-columns:repeat(auto-fit,minmax(118px,1fr));gap:10px;margin-top:22px;max-width:620px}
.fact{background:var(--bg-deep);border:1px solid var(--line-soft);border-radius:14px;padding:10px 16px;min-width:0}
.fact b{display:block;font-size:1.5rem;line-height:1.2;font-weight:800;font-variant-numeric:tabular-nums}
.fact span{color:var(--mute);font-size:.82rem}
h2{font-size:1.05rem;font-weight:700;margin:34px 0 14px;display:flex;align-items:center;gap:10px}
h2 i{font-style:normal;display:grid;place-items:center;width:26px;height:26px;border-radius:8px;background:var(--acc-fill);color:var(--on-acc);font-size:.85rem}
.sets{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.set{position:relative;display:flex;flex-direction:column;gap:3px;text-align:left;background:var(--card);border:2px solid var(--line-soft);border-radius:16px;padding:14px 14px 12px;cursor:pointer;transition:border-color .15s,background .15s,transform .15s;min-width:0}
.set:hover{border-color:var(--acc);transform:translateY(-1px)}
.set[aria-pressed="true"]{border-color:var(--acc);background:var(--card-hi)}
.set[aria-pressed="true"]::after{content:"✓";position:absolute;top:10px;right:12px;width:22px;height:22px;border-radius:50%;background:var(--acc-fill);color:var(--on-acc);display:grid;place-items:center;font-size:.8rem;font-weight:800}
.sn{font-size:1.9rem;font-weight:800;line-height:1.1;font-variant-numeric:tabular-nums}
.sn small{display:block;font-size:.72rem;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--mute);margin-bottom:2px}
.sc{color:var(--mute);font-size:.88rem;font-variant-numeric:tabular-nums;overflow-wrap:anywhere}
.sc b{display:block;color:var(--ink);font-weight:700;line-height:1.3;margin-bottom:2px}
.pb{display:flex;height:6px;border-radius:999px;background:var(--bg-deep);overflow:hidden;margin-top:8px}
.pb i{display:block;height:100%}
.pb .g{background:var(--ok-line)}
.pb .r{background:var(--bad-line)}
.sm{color:var(--mute);font-size:.76rem;min-height:1.2em;font-variant-numeric:tabular-nums}
.row{display:flex;flex-wrap:wrap;gap:12px;align-items:center;margin-top:14px}
.hint2{color:var(--mute);font-size:.88rem;margin-top:14px;max-width:70ch}
.opts-row{display:flex;flex-wrap:wrap;gap:12px 22px;align-items:center}
.lab{color:var(--mute);font-size:.9rem;font-weight:600}
.seg{display:inline-flex;background:var(--bg-deep);border:1px solid var(--line-soft);border-radius:12px;padding:3px;gap:2px}
.seg button{background:none;border:0;border-radius:9px;padding:7px 14px;cursor:pointer;font-weight:600;font-size:.92rem;color:var(--mute)}
.seg button[aria-pressed="true"]{background:var(--acc-fill);color:var(--on-acc)}
.tog{display:flex;align-items:center;gap:10px;cursor:pointer;font-weight:600;font-size:.92rem}
.tog input{width:18px;height:18px;accent-color:var(--acc-fill)}
.btn{border-radius:14px;padding:13px 22px;font-weight:700;cursor:pointer;background:var(--card-hi);border:2px solid var(--line);transition:background .15s,border-color .15s}
.btn:hover:not([disabled]){border-color:var(--acc)}
.btn.pri{background:var(--acc-fill);border-color:var(--acc-line);color:var(--on-acc)}
.btn.pri:hover:not([disabled]){background:var(--acc-fill-hi)}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.btn.big{padding:15px 28px;font-size:1.05rem}
.note{color:var(--mute);font-size:.88rem;margin-top:26px;max-width:70ch;border-left:3px solid var(--line);padding-left:14px}
.note + .note{margin-top:12px}

/* làm bài */
.qcard{margin-top:22px;background:var(--card);border:1px solid var(--line-soft);border-radius:20px;padding:22px 22px 24px}
.tag{color:var(--mute);font-size:.82rem;margin-bottom:10px;font-variant-numeric:tabular-nums;overflow-wrap:anywhere}
.qt{font-size:clamp(1.1rem,2.8vw,1.32rem);font-weight:600;line-height:1.5;overflow-wrap:anywhere;text-wrap:pretty}
.chip{display:inline-block;margin-top:10px;background:var(--bg-deep);border:1px solid var(--warn);color:var(--warn);border-radius:999px;padding:2px 12px;font-size:.84rem;font-weight:600}
.opts{display:grid;gap:10px;margin-top:18px}
.opt{display:flex;gap:13px;align-items:flex-start;text-align:left;width:100%;padding:13px 14px;border-radius:14px;background:var(--bg);border:2px solid var(--line-soft);transition:border-color .15s,background .15s}
button.opt{cursor:pointer}
button.opt:hover{border-color:var(--acc)}
.lt{flex:none;width:34px;height:34px;border-radius:10px;background:var(--card-hi);display:grid;place-items:center;font-weight:700;font-size:.92rem}
.ob{display:flex;flex-direction:column;gap:6px;min-width:0;padding-top:4px}
.ot{overflow-wrap:anywhere}
.opt.sel{border-color:var(--acc);background:var(--card-hi)}
.opt.sel .lt{background:var(--acc-fill)}
.opt.ok{border-color:var(--ok-line);background:var(--ok-bg)}
.opt.ok .lt{background:var(--ok-line);color:var(--on-ok)}
.opt.bad{border-color:var(--bad-line);background:var(--bad-bg)}
.opt.bad .lt{background:var(--bad-line);color:var(--on-bad)}
.opt.miss{border-style:dashed}
.tg{font-size:.8rem;font-weight:700;letter-spacing:.02em}
.opt.ok .tg{color:var(--ok)}
.opt.bad .tg{color:var(--bad)}
.on{color:var(--mute);font-size:.92rem;line-height:1.5;overflow-wrap:anywhere}
.opt.ok .on,.opt.bad .on{color:var(--ink)}
.ex,.flag{margin-top:16px;border-radius:16px;padding:16px 18px;scroll-margin-bottom:104px}
.ex{background:var(--bg-deep);border:1px solid var(--line)}
.flag{background:var(--bg-deep);border:1px solid var(--warn)}
.ex h3,.flag h3{font-size:.78rem;letter-spacing:.1em;text-transform:uppercase;font-weight:800;margin-bottom:6px}
.ex h3{color:var(--acc)}
.flag h3{color:var(--warn)}
.ex p,.flag p{overflow-wrap:anywhere}
.kb{color:var(--mute);font-size:.8rem;margin-top:14px;text-align:center}
@media (hover:none){.kb{display:none}}

/* thanh hành động dưới */
.dock{position:fixed;left:0;right:0;bottom:0;z-index:22;background:var(--bg-deep);border-top:1px solid var(--line);padding-top:10px;padding-bottom:max(10px,env(safe-area-inset-bottom,0px));padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.dk{max-width:860px;margin:0 auto;display:flex;align-items:center;gap:10px}
.vd{flex:1;min-width:0;display:flex;flex-direction:column;line-height:1.35;font-size:.9rem;color:var(--mute)}
.vd b{font-size:1.02rem}
.vd.ok b{color:var(--ok)}
.vd.bad b{color:var(--bad)}
.vd span{overflow-wrap:anywhere}
.dk .btn{padding:11px 18px;flex:none}

/* kết quả */
.score{margin-top:26px;background:var(--card);border:1px solid var(--line-soft);border-radius:22px;padding:28px 22px;text-align:center}
.ring{width:176px;height:176px;max-width:60vw;display:block;margin:6px auto 0}
.rt{fill:none;stroke:var(--bg-deep);stroke-width:10}
.rv{fill:none;stroke:var(--ok-line);stroke-width:10;stroke-linecap:round;transition:stroke-dasharray .6s}
.rv.low{stroke:var(--warn)}
.rp{font:800 26px var(--font);fill:var(--ink);text-anchor:middle;dominant-baseline:central}
.sc2{font-size:1.5rem;font-weight:800;margin-top:12px;font-variant-numeric:tabular-nums}
.sc2 small{font-size:.6em;color:var(--mute);font-weight:600}
.sub2{color:var(--mute);margin-top:2px}
.stats{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;margin-top:16px}
.wl{margin-top:12px;display:grid;gap:8px}
details{background:var(--card);border:1px solid var(--line-soft);border-radius:14px;padding:11px 16px}
summary{cursor:pointer;font-weight:600;overflow-wrap:anywhere}
details p{margin-top:8px;color:var(--mute);overflow-wrap:anywhere}
details b{color:var(--ink)}
details .bd{color:var(--bad)}
details .gd{color:var(--ok)}
@media (max-width:520px){
  .top.quiz .brand span{display:none}
  .set{padding:12px 11px 10px}
  .sm{font-size:.72rem}
  .qcard{padding:18px 14px 20px;border-radius:18px}
  .hero{padding-top:26px}
  .dk .btn{padding:10px 14px;font-size:.92rem}
  .btn{padding:12px 16px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>

<script>const DATA=[{"s":1,"u":"Cấu trúc Chương I","n":"1","q":"Chương I của tài liệu có tên là gì?","o":["Tổng quan về sân bay","Khai thác cảng hàng không","Dữ liệu sân bay","Phân loại tàu bay"],"a":[0],"e":"Chương I có tên \"Tổng quan về sân bay\". Chương II kế tiếp là \"Dữ liệu sân bay\".","w":{"b":"Tài liệu không có chương nào mang tên này. Hoạt động khai thác là mục V trong Chương I.","c":"Đây là tên của Chương II, nơi trình bày điểm quy chiếu, mã sân bay, mức cao, nhiệt độ tham chiếu, sức chịu tải và các cự ly công bố.","d":"Tài liệu không có chương nào mang tên này. Phân loại theo mã ICAO chỉ là mục III trong Chương I."},"t":"1"},{"s":1,"u":"Cấu trúc Chương I","n":"2","q":"Chương I gồm sáu mục lớn. Thứ tự đúng của sáu mục này là gì?","o":["Giới thiệu sân bay; Định nghĩa cơ bản; Phân loại; Các bộ phận; Các hoạt động khai thác; Lịch sử phát triển HKDD Việt Nam","Giới thiệu sân bay; Định nghĩa cơ bản; Phân loại; Các bộ phận; Lịch sử phát triển HKDD Việt Nam; Các hoạt động khai thác","Giới thiệu sân bay; Phân loại; Định nghĩa cơ bản; Các bộ phận; Các hoạt động khai thác; Lịch sử phát triển HKDD Việt Nam","Giới thiệu sân bay; Định nghĩa cơ bản; Phân loại; Các hoạt động khai thác; Các bộ phận; Lịch sử phát triển HKDD Việt Nam"],"a":[0],"e":"Sáu mục theo thứ tự: I. Giới thiệu sân bay, II. Định nghĩa cơ bản về sân bay, III. Phân loại sân bay, IV. Các bộ phận của sân bay, V. Các hoạt động khai thác tại sân bay, VI. Lịch sử phát triển HKDD Việt Nam.","w":{"b":"Thứ tự này đảo mục V và mục VI. Lịch sử phát triển HKDD Việt Nam là mục cuối cùng của chương.","c":"Thứ tự này đảo mục II và mục III. Trong file, định nghĩa cơ bản là mục II, phân loại là mục III.","d":"Thứ tự này đảo mục IV và mục V. Trong file, các bộ phận là mục IV, các hoạt động khai thác là mục V."},"t":"2"},{"s":1,"u":"Cấu trúc Chương I","n":"3","q":"Mục IV của Chương I có tiêu đề nào?","o":["Phân loại sân bay","Các bộ phận của sân bay","Lịch sử phát triển HKDD Việt Nam","Các hoạt động khai thác tại sân bay"],"a":[1],"e":"Mục IV mang tên \"Các bộ phận của sân bay\". File chỉ ghi tiêu đề này, không có nội dung riêng bên dưới. Ba bộ phận của sân bay (đường CHC, đường lăn, sân đỗ) nằm ở phần định nghĩa mục II.","w":{"a":"Đây là tiêu đề của mục III.","c":"Đây là tiêu đề của mục VI.","d":"Đây là tiêu đề của mục V."},"t":"3"},{"s":1,"u":"Cấu trúc Chương I","n":"4","q":"Phần phân biệt sân bay với cảng hàng không nằm ở mục nào của Chương I?","o":["Mục V, Các hoạt động khai thác tại sân bay","Mục III, Phân loại sân bay","Mục I, Giới thiệu sân bay","Mục II, Định nghĩa cơ bản về sân bay"],"a":[3],"e":"Dòng \"Sự khác nhau giữa Sân bay / Cảng HK\" thuộc mục II, Định nghĩa cơ bản về sân bay.","w":{"a":"Mục V nói về công việc khai thác trên đường băng, đường lăn, sân đỗ và dịch vụ thương mại.","b":"Mục III trình bày phân loại theo ICAO với bảng mã số và mã chữ.","c":"File chỉ ghi tiêu đề mục I. Phần phân biệt nằm ở mục II."},"t":"4"},{"s":1,"u":"Sân bay và cảng hàng không","n":"5","q":"Theo file, sân bay là gì?","o":["Toàn bộ vùng trời xung quanh khu vực cất cánh và hạ cánh","Khu vực gồm sân bay, nhà ga thương mại và các công trình, thiết bị","Khu vực xác định phục vụ tàu bay cất hạ cánh","Khu vực dành riêng cho dịch vụ hành khách và hàng hóa"],"a":[2],"e":"File định nghĩa sân bay là khu vực xác định phục vụ tàu bay cất hạ cánh (CHC).","w":{"a":"Định nghĩa trong file nói về một khu vực xác định phục vụ tàu bay cất hạ cánh, không nói về vùng trời.","b":"Đây là định nghĩa của cảng hàng không.","d":"Dịch vụ hành khách và hàng hóa gắn với nhà ga thương mại của cảng hàng không."},"t":"5"},{"s":1,"u":"Sân bay và cảng hàng không","n":"6","q":"Chữ CHC trong cụm \"đường CHC\" là viết tắt của cụm từ nào?","o":["Cất hạ cánh","Chuẩn hạ cánh","Cất hãm cánh","Chạy hạ cánh"],"a":[0],"e":"CHC là cất hạ cánh. Đường CHC là đường dùng cho tàu bay cất cánh và hạ cánh.","w":{"b":"Chữ C đầu tiên là \"cất\". Cụm này không có nghĩa \"chuẩn\".","c":"\"Hãm\" liên quan đến cự ly hãm đà ASDA ở Chương II, không nằm trong cụm CHC.","d":"Chữ C đầu tiên là \"cất\", ứng với giai đoạn tàu bay rời mặt đất."},"t":"6"},{"s":1,"u":"Sân bay và cảng hàng không","n":"7","q":"Theo file, một sân bay gồm những bộ phận nào?","o":["Đường lăn, sân đỗ, công trình và thiết bị","Đường CHC, đường lăn, nhà ga thương mại","Đường CHC, nhà ga, sân đỗ","Đường CHC, đường lăn, sân đỗ"],"a":[3],"e":"Sân bay gồm ba thành phần: đường CHC, đường lăn và sân đỗ.","w":{"a":"Thiếu đường CHC, và công trình, thiết bị thuộc phần mở rộng của cảng hàng không.","b":"Nhà ga thương mại không nằm trong sân bay, còn sân đỗ bị bỏ sót.","c":"Nhà ga (thương mại) thuộc cảng hàng không, không thuộc định nghĩa sân bay."},"t":"7"},{"s":1,"u":"Sân bay và cảng hàng không","n":"8","q":"Theo file, cảng hàng không gồm những thành phần nào?","o":["Đường CHC và nhà ga thương mại","Chỉ đường CHC, đường lăn và sân đỗ","Nhà ga, công trình và thiết bị, không gồm sân bay","Sân bay, nhà ga (thương mại), công trình và thiết bị"],"a":[3],"e":"Cảng hàng không = sân bay + nhà ga (thương mại) + công trình, thiết bị.","w":{"a":"Thiếu đường lăn, sân đỗ, công trình và thiết bị.","b":"Ba thành phần này là sân bay. Cảng hàng không còn có nhà ga, công trình và thiết bị.","c":"File ghi cảng hàng không bao gồm cả sân bay."},"t":"8"},{"s":1,"u":"Sân bay và cảng hàng không","n":"9","q":"Thành phần nào làm phạm vi của cảng hàng không rộng hơn sân bay?","o":["Sân đỗ","Đường lăn","Nhà ga thương mại cùng công trình, thiết bị","Đường CHC"],"a":[2],"e":"Sân bay đã có đường CHC, đường lăn, sân đỗ. Cảng hàng không thêm nhà ga (thương mại), công trình và thiết bị.","w":{"a":"Sân đỗ đã thuộc sân bay.","b":"Đường lăn đã thuộc sân bay.","d":"Đường CHC đã thuộc sân bay."},"t":"9"},{"s":1,"u":"Sân bay và cảng hàng không","n":"10","q":"Trong định nghĩa cảng hàng không của file, thành phần nào được ghi chú là \"thương mại\"?","o":["Đường CHC","Đường lăn","Sân đỗ","Nhà ga"],"a":[3],"e":"File ghi \"nhà ga (thương mại)\". Dịch vụ khai thác thương mại cũng là hạng mục riêng trong mục V.","w":{"a":"Đường CHC thuộc định nghĩa sân bay, không có ghi chú thương mại.","b":"File không ghi chú thương mại cho đường lăn.","c":"Sân đỗ thuộc định nghĩa sân bay, không có ghi chú thương mại."},"t":"10"},{"s":1,"u":"Phân loại sân bay theo ICAO","n":"11","q":"Phân loại sân bay trong mục III của file theo tiêu chuẩn của tổ chức nào?","o":["ICAO, Tổ chức Hàng không dân dụng quốc tế","FAA, Cục Hàng không Liên bang Hoa Kỳ","IATA, Hiệp hội Vận tải hàng không quốc tế","ACI, Hội đồng Sân bay quốc tế"],"a":[0],"e":"File ghi \"Phân loại theo ICAO\". Mã số dựa vào chiều dài đường CHC, mã chữ dựa vào kích thước tàu bay.","w":{"b":"Cơ quan này không được nhắc đến. Bảng trong file ghi rõ phân loại theo ICAO.","c":"IATA xuất hiện ở Chương II với mã sân bay 3 chữ cái dùng trong thương mại.","d":"Tổ chức này không được nhắc đến. Bảng trong file ghi rõ phân loại theo ICAO."},"t":"11"},{"s":1,"u":"Phân loại sân bay theo ICAO","n":"12","q":"Mã số trong bảng phân loại ICAO được xác định theo đặc tính nào?","o":["Chiều dài khai thác đường CHC","Số lượng đường lăn của sân bay","Khoảng cách các bánh ngoài của hai càng chính","Sải cánh của tàu bay"],"a":[0],"e":"Cột đầu của bảng ghi \"Mã số\" cùng \"Chiều dài khai thác đường CHC\".","w":{"b":"Đặc tính này không có trong bảng.","c":"Đặc tính này dùng để xác định mã chữ.","d":"Sải cánh dùng để xác định mã chữ."},"t":"12"},{"s":1,"u":"Phân loại sân bay theo ICAO","n":"13","q":"Mã chữ trong bảng phân loại ICAO được xác định theo các đặc tính nào?","o":["Chiều dài khai thác đường CHC và sải cánh","Sải cánh và khoảng cách các bánh ngoài của hai càng chính","Chiều dài khai thác đường CHC và khoảng cách các bánh ngoài","Chiều dài thân tàu bay và sải cánh"],"a":[1],"e":"Mã chữ gắn với hai cột: sải cánh, và khoảng cách các bánh ngoài của hai càng chính.","w":{"a":"Chiều dài khai thác đường CHC thuộc về mã số.","c":"Chiều dài khai thác đường CHC thuộc về mã số.","d":"Chiều dài thân tàu bay không có trong bảng."},"t":"13"},{"s":1,"u":"Phân loại sân bay theo ICAO","n":"14","q":"Bảng phân loại ICAO trong file có bao nhiêu mã số và bao nhiêu mã chữ?","o":["6 mã số (1 đến 6) và 4 mã chữ (A đến D)","4 mã số (1 đến 4) và 6 mã chữ (A đến F)","3 mã số (1 đến 3) và 6 mã chữ (A đến F)","4 mã số (1 đến 4) và 5 mã chữ (A đến E)"],"a":[1],"e":"Mã số 1, 2, 3, 4 ứng với 4 dải chiều dài đường CHC. Mã chữ A, B, C, D, E, F ứng với 6 dải sải cánh.","w":{"a":"Số lượng bị đảo. Mã số chỉ có 1, 2, 3, 4, còn mã chữ có A, B, C, D, E, F.","c":"Mã số còn có 4, ứng với đường CHC dài hơn 1800m.","d":"Mã chữ còn có F, ứng với sải cánh 65-80m."},"t":"14"},{"s":1,"u":"Phân loại sân bay theo ICAO","n":"15","q":"Nhóm tàu bay A320, A321 và B737 thuộc mã phân cấp sân bay nào theo ICAO trong file?","o":["3C / 4C","4F","3A / 4A","4D / 4E"],"a":[0],"e":"File ghi: 3C / 4C gồm A320, A321, B737. 4D / 4E gồm B767, B787, A330, A350. 4F gồm A380, B747-8.","w":{"b":"Nhóm này gồm A380 và B747-8.","c":"File không có nhóm này.","d":"Nhóm này gồm B767, B787, A330, A350."},"t":"15"},{"s":1,"u":"Phân loại sân bay theo ICAO","n":"16","q":"Nhóm tàu bay B767, B787, A330 và A350 thuộc mã phân cấp sân bay nào?","o":["4F","4D / 4E","3C / 4C","3D / 4D"],"a":[1],"e":"Các tàu bay thân rộng B767, B787, A330, A350 thuộc nhóm 4D / 4E trong file.","w":{"a":"Nhóm này gồm A380 và B747-8.","c":"Nhóm này gồm A320, A321, B737.","d":"File không có nhóm 3D, và nhóm này còn thêm mã chữ E."},"t":"16"},{"s":1,"u":"Phân loại sân bay theo ICAO","n":"17","q":"Tàu bay nào thuộc mã 4F theo file?","o":["A330","A320","B787","A380"],"a":[3],"e":"Mã 4F gồm A380 và B747-8. Đây là hai loại lớn nhất trong ba nhóm của file, ứng với mã chữ F (sải cánh 65-80m).","w":{"a":"A330 thuộc nhóm 4D / 4E.","b":"A320 thuộc nhóm 3C / 4C.","c":"B787 thuộc nhóm 4D / 4E."},"t":"17"},{"s":1,"u":"Phân loại sân bay theo ICAO","n":"18","q":"Tàu bay nào dưới đây thuộc mã 4F theo file?","o":["A350","B737","B767","B747-8"],"a":[3],"e":"B747-8 cùng A380 là hai loại của nhóm 4F.","w":{"a":"A350 thuộc nhóm 4D / 4E.","b":"B737 thuộc nhóm 3C / 4C.","c":"B767 thuộc nhóm 4D / 4E."},"t":"18"},{"s":1,"u":"Phân loại sân bay theo ICAO","n":"19","q":"Tàu bay nào KHÔNG thuộc nhóm 4D / 4E?","o":["A321","B787","A350","B767"],"a":[0],"e":"A321 thuộc nhóm 3C / 4C cùng A320 và B737.","w":{"b":"B787 thuộc nhóm 4D / 4E.","c":"A350 thuộc nhóm 4D / 4E.","d":"B767 thuộc nhóm 4D / 4E."},"t":"19"},{"s":1,"u":"Phân loại sân bay theo ICAO","n":"20","q":"Nhóm 3C / 4C gồm những tàu bay nào?","o":["A320, A321, B737","A330, A350, B787","B767, A321, A320","A380, B747-8, B737"],"a":[0],"e":"3C / 4C gồm A320, A321, B737.","w":{"b":"Ba loại này thuộc nhóm 4D / 4E.","c":"B767 thuộc nhóm 4D / 4E.","d":"A380 và B747-8 thuộc nhóm 4F."},"t":"20"},{"s":1,"u":"Phân loại sân bay theo ICAO","n":"21","q":"Với tàu bay mã 4C như A320, mã số 3 hoặc 4 của sân bay gợi ý điều gì?","o":["Tàu bay khai thác ở đường CHC dài từ 1200m trở lên","Tàu bay chỉ khai thác ở đường CHC dài dưới 800m","Mã số 3 hoặc 4 nói về sải cánh của tàu bay","Tàu bay chỉ khai thác ở đường CHC dài 800-1200m"],"a":[0],"e":"Mã số 3 ứng với 1200-1800m, mã số 4 ứng với trên 1800m. Mã chữ C ứng với sải cánh 24-36m.","w":{"b":"Đường CHC dài dưới 800m có mã số 1.","c":"Sải cánh được thể hiện bằng mã chữ. Mã số nói về chiều dài đường CHC.","d":"Dải này có mã số 2, không có trong nhóm 3C / 4C."},"t":"21"},{"s":1,"u":"Các hoạt động khai thác tại sân bay","n":"22","q":"Mục V của Chương I chia hoạt động khai thác thành mấy phần?","o":["Ba phần: đường băng / đường lăn, sân đỗ, dịch vụ khai thác thương mại","Hai phần: đường băng / đường lăn và sân đỗ","Bốn phần, thêm phần nhà ga hành khách","Ba phần: đường CHC, đường lăn, sân đỗ"],"a":[0],"e":"Mục V gồm: 1. Khai thác trên đường băng / đường lăn, 2. Khai thác trên sân đỗ, 3. Dịch vụ khai thác thương mại.","w":{"b":"File còn có phần thứ ba là dịch vụ khai thác thương mại.","c":"File không có phần riêng cho nhà ga hành khách.","d":"Ba bộ phận này là thành phần của sân bay trong mục II, không phải ba phần của mục V."},"t":"22"},{"s":1,"u":"Các hoạt động khai thác tại sân bay","n":"23","q":"Công việc nào thuộc khai thác trên đường băng / đường lăn?","o":["Xe cấp nước sạch","Nạp nhiên liệu","Kiểm soát chim trên đường băng","Kéo đẩy tàu bay"],"a":[2],"e":"Khai thác trên đường băng / đường lăn gồm kiểm tra đường băng / đường lăn, dẫn dắt tàu bay, kiểm soát chim, kiểm tra hệ thống đèn.","w":{"a":"Cấp nước sạch thuộc khai thác trên sân đỗ.","b":"Nạp nhiên liệu thuộc khai thác trên sân đỗ.","d":"Kéo đẩy tàu bay thuộc khai thác trên sân đỗ."},"t":"23"},{"s":1,"u":"Các hoạt động khai thác tại sân bay","n":"24","q":"Việc nào được liệt kê đầu tiên trong phần khai thác trên đường băng / đường lăn?","o":["Kiểm soát chim trên đường băng","Kiểm tra đường băng / đường lăn","Kiểm tra hệ thống đèn đường băng - lăn","Dẫn dắt tàu bay về vị trí đỗ"],"a":[1],"e":"Thứ tự trong file: kiểm tra đường băng / đường lăn; dẫn dắt tàu bay; kiểm soát chim; kiểm tra hệ thống đèn.","w":{"a":"Việc này đứng sau phần dẫn dắt tàu bay.","c":"Việc này là mục cuối của phần 1.","d":"Việc này đứng thứ hai trong danh sách."},"t":"24"},{"s":1,"u":"Các hoạt động khai thác tại sân bay","n":"25","q":"Việc dẫn dắt tàu bay trong file nhằm mục đích gì?","o":["Điều hòa luồng hành khách tại nhà ga","Đưa tàu bay về vị trí đỗ và lăn ra đường bay cất cánh","Kéo tàu bay đi bảo dưỡng định kỳ","Đưa tàu bay lên độ cao hành trình sau khi cất cánh"],"a":[1],"e":"File ghi: dẫn dắt tàu bay về vị trí đỗ và lăn ra đường bay cất cánh.","w":{"a":"Việc này thuộc khai thác nhà ga, không thuộc dẫn dắt tàu bay.","c":"File không nhắc bảo dưỡng định kỳ trong mục này.","d":"Dẫn dắt diễn ra trên mặt đất, trước lúc cất cánh hoặc sau khi hạ cánh."},"t":"25"},{"s":1,"u":"Các hoạt động khai thác tại sân bay","n":"26","q":"Phương tiện hoặc lực lượng nào KHÔNG được liệt kê trong phần dẫn dắt tàu bay?","o":["Bộ phận điều hành sân đỗ","Radar thời tiết","Đài chỉ huy tại sân (tower)","Hệ thống dẫn dắt tự động"],"a":[1],"e":"File liệt kê bốn cách dẫn dắt: đài chỉ huy tại sân (tower); bộ phận điều hành sân đỗ; xe follow me cùng nhân viên chỉ dẫn bằng ký hiệu tay (marshalling); hệ thống dẫn dắt tự động.","w":{"a":"Bộ phận này được liệt kê.","c":"Tower được liệt kê.","d":"Hệ thống này được liệt kê."},"t":"26"},{"s":1,"u":"Các hoạt động khai thác tại sân bay","n":"27","q":"Trong file, xe follow me được ghép cùng lực lượng nào?","o":["Đài chỉ huy tại sân (tower)","Hệ thống dẫn dắt tự động","Nhân viên chỉ dẫn bằng ký hiệu tay (marshalling)","Bộ phận điều hành sân đỗ"],"a":[2],"e":"File ghi \"xe follow me + nhân viên chỉ dẫn bằng ký hiệu tay (marshalling)\" trong cùng một dòng.","w":{"a":"Tower ghi ở dòng riêng.","b":"Hệ thống tự động ghi ở dòng riêng, không đi cùng xe follow me.","d":"Bộ phận điều hành sân đỗ được ghi ở dòng riêng."},"t":"27"},{"s":1,"u":"Các hoạt động khai thác tại sân bay","n":"28","q":"Marshalling trong file là hình thức dẫn dắt nào?","o":["Chỉ huy từ đài kiểm soát tại sân","Xe dẫn đường chạy phía trước tàu bay","Nhân viên chỉ dẫn tàu bay bằng ký hiệu tay","Hệ thống tự động dẫn tàu bay vào vị trí đỗ"],"a":[2],"e":"Marshalling là nhân viên chỉ dẫn bằng ký hiệu tay. Xe follow me, hệ thống dẫn dắt tự động, tower và bộ phận điều hành sân đỗ là các cách còn lại.","w":{"a":"Đây là đài chỉ huy tại sân (tower).","b":"Đây là xe follow me.","d":"Đây là hệ thống dẫn dắt tự động."},"t":"28"},{"s":1,"u":"Các hoạt động khai thác tại sân bay","n":"29","q":"Đài chỉ huy tại sân (tower) được liệt kê trong nhóm công việc nào?","o":["Cung cấp điện và khí nén cho tàu bay","Dẫn dắt tàu bay về vị trí đỗ và lăn ra đường bay cất cánh","Kiểm soát chim trên đường băng","Kiểm tra hệ thống đèn trước khi tối"],"a":[1],"e":"Tower là một trong bốn cách dẫn dắt tàu bay trong phần 1 của mục V.","w":{"a":"Việc này thuộc khai thác trên sân đỗ.","c":"Dòng này không có mục con nào.","d":"Nhóm này liệt kê các loại đèn."},"t":"29"},{"s":1,"u":"Các hoạt động khai thác tại sân bay","n":"30","q":"Việc kiểm soát chim được ghi trong phần nào của mục V?","o":["Lịch sử phát triển HKDD Việt Nam","Dịch vụ khai thác thương mại","Khai thác trên sân đỗ","Khai thác trên đường băng / đường lăn"],"a":[3],"e":"\"Kiểm soát chim trên đường băng\" nằm trong phần 1, khai thác trên đường băng / đường lăn.","w":{"a":"Đây là mục VI, không liên quan đến khai thác.","b":"Phần này chỉ ghi tiêu đề trong file.","c":"Phần sân đỗ gồm điện, khí nén, nhiên liệu, nước sạch, kéo đẩy."},"t":"30"},{"s":1,"u":"Các hoạt động khai thác tại sân bay","n":"31","q":"Việc kiểm tra hệ thống đèn đường băng - lăn được thực hiện vào thời điểm nào?","o":["Vào giữa trưa","Trước khi tối","Ngay sau khi trời sáng","Sau mỗi lần tàu bay hạ cánh"],"a":[1],"e":"File ghi: \"trước khi tối, kiểm tra hệ thống đèn\". Lúc trời tối, đèn là phương tiện dẫn hướng chính cho phi công.","w":{"a":"File ghi thời điểm là trước khi tối.","c":"File ghi thời điểm là trước khi tối.","d":"File không nêu tần suất theo từng lần hạ cánh."},"t":"31"},{"s":1,"u":"Các hoạt động khai thác tại sân bay","n":"32","q":"Hệ thống đèn cần kiểm tra trước khi tối gồm mấy nhóm?","o":["3 nhóm","4 nhóm","5 nhóm","2 nhóm"],"a":[1],"e":"Bốn nhóm: đèn đường lăn / đường băng; hệ thống đèn hỗ trợ tiếp cận, hạ cánh; đèn báo hiệu các vật cản; đèn nhận dạng sân bay.","w":{"a":"File liệt kê 4 nhóm.","c":"File liệt kê 4 nhóm.","d":"File liệt kê 4 nhóm."},"t":"32"},{"s":1,"u":"Các hoạt động khai thác tại sân bay","n":"33","q":"Loại đèn nào KHÔNG nằm trong danh sách đèn cần kiểm tra trước khi tối?","o":["Đèn đường lăn / đường băng","Đèn trang trí nhà ga","Đèn báo hiệu các vật cản","Đèn nhận dạng sân bay"],"a":[1],"e":"Danh sách chỉ gồm đèn đường lăn / đường băng, hệ thống đèn hỗ trợ tiếp cận, hạ cánh, đèn báo hiệu các vật cản và đèn nhận dạng sân bay.","w":{"a":"Loại đèn này có trong danh sách.","c":"Loại đèn này có trong danh sách.","d":"Loại đèn này có trong danh sách."},"t":"33"},{"s":1,"u":"Các hoạt động khai thác tại sân bay","n":"34","q":"Loại đèn nào hỗ trợ tàu bay trong giai đoạn tiếp cận và hạ cánh?"  CHC dài 1500m khai thác tàu bay sải cánh 30m. Mã số và mã chữ của sân bay theo bảng phân loại ICAO là gì?","o":["3B","1C","3C","3D"],"a":[2],"e":"Chiều dài 1500m thuộc mã số 3 (1200-1800m). Sải cánh 30m thuộc mã chữ C (24-36m). Mã tham chiếu là 3C.","w":{"a":"Mã 3B chưa khớp: sải cánh 30m thuộc mã chữ C (24-36m).","b":"Mã 1C chưa khớp: đường CHC dài 1500m thuộc mã số 3 (1200-1800m).","d":"Mã 3D chưa khớp: sải cánh 30m thuộc mã chữ C (24-36m)."},"t":"94"},{"s":1,"u":"Bảng phân loại ICAO: mã số và mã chữ","n":"95","q":"Một sân bay có đường CHC dài 2500m khai thác tàu bay sải cánh 45m. Mã số và mã chữ của sân bay theo bảng phân loại ICAO là gì?","o":["4F","4A","4D","4C"],"a":[2],"e":"Chiều dài 2500m thuộc mã số 4 (>1800m). Sải cánh 45m thuộc mã chữ D (36-52m). Mã tham chiếu là 4D.","w":{"a":"Mã 4F chưa khớp: sải cánh 45m thuộc mã chữ D (36-52m).","b":"Mã 4A chưa khớp: sải cánh 45m thuộc mã chữ D (36-52m).","d":"Mã 4C chưa khớp: sải cánh 45m thuộc mã chữ D (36-52m)."},"t":"95"},{"s":1,"u":"Bảng phân loại ICAO: mã số và mã chữ","n":"96","q":"Một sân bay có đường CHC dài 3000m khai thác tàu bay sải cánh 60m. Mã số và mã chữ của sân bay theo bảng phân loại ICAO là gì?","o":["4F","4E","2E","4C"],"a":[1],"e":"Chiều dài 3000m thuộc mã số 4 (>1800m). Sải cánh 60m thuộc mã chữ E (52-65m). Mã tham chiếu là 4E.","w":{"a":"Mã 4F chưa khớp: sải cánh 60m thuộc mã chữ E (52-65m).","c":"Mã 2E chưa khớp: đường CHC dài 3000m thuộc mã số 4 (>1800m).","d":"Mã 4C chưa khớp: sải cánh 60m thuộc mã chữ E (52-65m)."},"t":"96"},{"s":1,"u":"Bảng phân loại ICAO: mã số và mã chữ","n":"97","q":"Một sân bay có đường CHC dài 3500m khai thác tàu bay sải cánh 70m. Mã số và mã chữ của sân bay theo bảng phân loại ICAO là gì?","o":["2F","4F","1F","4D"],"a":[1],"e":"Chiều dài 3500m thuộc mã số 4 (>1800m). Sải cánh 70m thuộc mã chữ F (65-80m). Mã tham chiếu là 4F.","w":{"a":"Mã 2F chưa khớp: đường CHC dài 3500m thuộc mã số 4 (>1800m).","c":"Mã 1F chưa khớp: đường CHC dài 3500m thuộc mã số 4 (>1800m).","d":"Mã 4D chưa khớp: sải cánh 70m thuộc mã chữ F (65-80m)."},"t":"97"},{"s":2,"u":"Cấu trúc Chương II","n":"98","q":"Chương II của tài liệu có tên là gì?","o":["Khai thác tại sân bay","Tổng quan về sân bay","Dữ liệu sân bay","Phân loại sân bay"],"a":[2],"e":"Chương II có tên \"Dữ liệu sân bay\". Chương này nói về các số liệu mô tả sân bay: điểm quy chiếu, mã, mức cao, nhiệt độ, sức chịu tải, cự ly công bố.","w":{"a":"Khai thác tại sân bay là mục V của Chương I.","b":"Đây là tên của Chương I.","d":"Phân loại sân bay là mục III của Chương I."},"t":"98"},{"s":2,"u":"Cấu trúc Chương II","n":"99","q":"Chương II có bao nhiêu mục lớn?","o":["7 mục","8 mục","6 mục","5 mục"],"a":[0],"e":"Bảy mục: I. Điểm quy chiếu sân bay, II. Chỉ địa danh sân bay (mã sân bay), III. Mức cao sân bay, IV. Nhiệt độ tham chiếu sân bay, V. Sức chịu tải mặt đường sân bay, VI. Các cự ly được công bố, VII. Hiệp đồng giữa nhà chức trách sân bay và cơ sở cung cấp dịch vụ thông báo tin tức hàng không.","w":{"b":"Mục cuối cùng của Chương II là mục VII, nên chỉ có 7 mục.","c":"Chương I mới có 6 mục. Chương II có 7 mục.","d":"File có 7 mục lớn, đánh số từ I đến VII."},"t":"99"},{"s":2,"u":"Cấu trúc Chương II","n":"100","q":"Thứ tự đúng của các mục từ I đến VII trong Chương II là gì?","o":["Điểm quy chiếu; Mã sân bay; Nhiệt độ tham chiếu; Mức cao; Sức chịu tải mặt đường; Các cự ly công bố; Hiệp đồng với AIS","Mã sân bay; Điểm quy chiếu; Mức cao; Nhiệt độ tham chiếu; Sức chịu tải mặt đường; Các cự ly công bố; Hiệp đồng với AIS","Điểm quy chiếu; Mã sân bay; Mức cao; Nhiệt độ tham chiếu; Sức chịu tải mặt đường; Các cự ly công bố; Hiệp đồng với AIS","Điểm quy chiếu; Mã sân bay; Mức cao; Nhiệt độ tham chiếu; Các cự ly công bố; Sức chịu tải mặt đường; Hiệp đồng với AIS"],"a":[2],"e":"Điểm quy chiếu (I), mã sân bay (II), mức cao (III), nhiệt độ tham chiếu (IV), sức chịu tải mặt đường (V), các cự ly công bố (VI), hiệp đồng với AIS (VII).","w":{"a":"Mục III và IV bị đảo. Mức cao là mục III, nhiệt độ tham chiếu là mục Southern Europe, Israel, Palestine\".","w":{"a":"Greece dùng LG, Hungary dùng LH.","c":"LV là mã của Palestine.","d":"Hai quốc gia bị đảo. LL là Israel, LV là Palestine."},"t":"381"},{"s":3,"u":"Các trường hợp đặc biệt của mã ICAO","n":"382","q":"Theo file, mã OR là của quốc gia nào?","o":["Iran","Pakistan","Qatar","Afghanistan"],"a":[0],"e":"File ghi \"OR: Iran\", đồng thời \"OI: Iran\". Vì vậy file liệt kê hai mã cho Iran.","w":{"b":"Pakistan dùng mã OP.","c":"Qatar dùng mã OT.","d":"Afghanistan dùng mã OA."},"t":"382","f":"File ghi OR là Iran. Trong danh sách mã địa điểm của ICAO, OR là mã của Iraq còn Iran dùng OI. Điểm tính theo file."},{"s":3,"u":"Các trường hợp đặc biệt của mã ICAO","n":"383","q":"Theo file, Iran có những mã ICAO hai chữ cái đầu nào?","o":["OA và OI","OI và OM","OI và OR","OP và OR"],"a":[2],"e":"File ghi \"OI: Iran\" và \"OR: Iran\".","w":{"a":"OA là mã của Afghanistan.","b":"OM là mã của UAE.","d":"OP là mã của Pakistan."},"t":"383","f":"File ghi OR là Iran. Trong danh sách mã địa điểm của ICAO, OR là mã của Iraq còn Iran dùng OI. Điểm tính theo file."},{"s":3,"u":"Các trường hợp đặc biệt của mã ICAO","n":"384","q":"Theo file, chữ cái đầu \"P\" của mã ICAO ứng với quốc gia nào?","o":["Philippines","Pakistan","Peru","the US, Hoa Kỳ"],"a":[3],"e":"File ghi \"P-the US\". File không liệt kê mã hai chữ cái cho chữ P.","w":{"a":"Philippines dùng mã RP, bắt đầu bằng R.","b":"Pakistan dùng mã OP, bắt đầu bằng O.","c":"Peru dùng mã SP, bắt đầu bằng S."},"t":"384","f":"File ghi P là the US và không có chữ K. Trong thực tế, nước Mỹ lục địa dùng chữ K (ví dụ KJFK), còn chữ P dùng cho Alaska, Hawaii và các lãnh thổ Thái Bình Dương. Điểm tính theo file."},{"s":3,"u":"Các trường hợp đặc biệt của mã ICAO","n":"385","q":"Theo file, mã ICAO hai chữ cái đầu của Việt Nam là gì?","o":["VN","VY","VV","VT"],"a":[2],"e":"File ghi \"VV: Vietnam\". Chữ V đầu thuộc nhóm Nam Á và Đông Nam Á lục địa.","w":{"a":"VN là mã của Nepal.","b":"VY là mã của Myanmar.","d":"VT là mã của Thailand."},"t":"385"},{"s":3,"u":"Các trường hợp đặc biệt của mã ICAO","n":"386","q":"Theo file, Hong Kong và Macau dùng mã ICAO hai chữ cái đầu nào?","o":["VH là Hong Kong, VN là Macau","VH là Macau, VM là Hong Kong","VH là Hong Kong, VM là Macau","VL là Hong Kong, VM là Macau"],"a":[2],"e":"File ghi \"VH: Hong Kong\" và \"VM: Macau\".","w":{"a":"VN là mã của Nepal.","b":"Hai mã bị đảo. VH là Hong Kong, VM là Macau.","d":"VL là mã của Laos."},"t":"386"},{"s":3,"u":"Các trường hợp đặc biệt của mã ICAO","n":"387","q":"Theo file, những nước nào dùng chữ cái đầu V của mã ICAO ở Đông Nam Á lục địa?","o":["Cambodia (VD), Laos (VL), Thailand (VT), Vietnam (VV), Myanmar (VY)","Thailand (VT), Vietnam (VV), Malaysia (WM), Brunei (WB), Singapore (WS)","Cambodia (VD), Laos (VL), Philippines (RP), Vietnam (VV), Myanmar (VY)","Indonesia (WA), Brunei (WB), Malaysia (WM), Singapore (WS), Timor-Leste (WP)"],"a":[0],"e":"Nhóm V trong file mô tả \"Many South Asian countries, mainland Southeast Asia\", gồm VD, VL, VT, VV, VY và các nước Nam Á.","w":{"b":"Malaysia, Brunei, Singapore dùng chữ cái đầu W.","c":"Philippines dùng mã RP, thuộc nhóm R.","d":"Các nước này dùng chữ cái đầu W."},"t":"387"},{"s":3,"u":"Các trường hợp đặc biệt của mã ICAO","n":"388","q":"Theo file, những nước nào dùng chữ cái đầu W của mã ICAO?","o":["Indonesia, Philippines, Malaysia, Timor-Leste, Singapore","Cambodia, Brunei, Malaysia, Timor-Leste, Singapore","Indonesia, Brunei, Malaysia, Timor-Leste, Singapore","Indonesia, Brunei, Malaysia, Vietnam, Singapore"],"a":[2],"e":"Nhóm W trong file mô tả \"Most of Maritime Southeast Asia\": WA/WI/WR Indonesia, WB Brunei, WM Malaysia, WP Timor-Leste, WS Singapore.","w":{"a":"Philippines dùng mã RP.","b":"Cambodia dùng mã VD.","d":"Vietnam dùng mã VV."},"t":"388"},{"s":3,"u":"Các trường hợp đặc biệt của mã ICAO","n":"389","q":"Theo file, hai nước nào dùng chữ cái đầu Z của mã ICAO?","o":["China và Taiwan","China và S. Korea","China và N. Korea","N. Korea và Japan"],"a":[2],"e":"File ghi \"ZA/ZB/ZC/ZJ/ZL/ZM/ZP/ZS/ZU/ZW/ZY: China\" và \"ZK: N.Korea\".","w":{"a":"Taiwan dùng mã RC.","b":"S. Korea dùng mã RK.","d":"Japan dùng mã RJ và RO."},"t":"389"},{"s":3,"u":"Các trường hợp đặc biệt của mã ICAO","n":"390","q":"Theo file, mã ZM thuộc quốc gia nào?","o":["N. Korea (Triều Tiên)","China (Trung Quốc)","Hong Kong (Hồng Kông)","Taiwan (Đài Loan)"],"a":[1],"e":"File ghi ZM nằm trong dãy \"ZA/ZB/ZC/ZJ/ZL/ZM/ZP/ZS/ZU/ZW/ZY: China\".","w":{"a":"N. Korea dùng mã ZK.","c":"Hong Kong dùng mã VH.","d":"Taiwan dùng mã RC."},"t":"390","f":"File xếp ZM vào nhóm mã của China. Trong danh sách mã địa điểm của ICAO, ZM là mã của Mông Cổ. Điểm tính theo file."},{"s":3,"u":"Các trường hợp đặc biệt của mã ICAO","n":"391","q":"Theo file, mã ICAO của Triều Tiên (N. Korea) là gì?","o":["ZK","RC","ZB","RK"],"a":[0],"e":"File ghi \"ZK: N.Korea\".","w":{"b":"RC là mã của Taiwan.","c":"ZB là một trong các mã của China.","d":"RK là mã của S. Korea."},"t":"391"},{"s":3,"u":"Các trường hợp đặc biệt của mã ICAO","n":"392","q":"Theo file, mã ICAO của Hàn Quốc (S. Korea) là gì?","o":["ZK","RP","RC","RK"],"a":[3],"e":"File ghi \"RK: S.Korea\".","w":{"a":"ZK là mã của N. Korea.","b":"RP là mã của Philippines.","c":"RC là mã của Taiwan."},"t":"392"},{"s":3,"u":"Các trường hợp đặc biệt của mã ICAO","n":"393","q":"Dòng \"*Mã IATA / ICAO của các sân bay thường gặp\" trong file có nội dung gì kèm theo?","o":["Danh sách các hãng hàng không thành viên IATA","Chỉ có tiêu đề, không có bảng mã đi kèm","Bảng đầy đủ mã IATA và ICAO của các sân bay Việt Nam","Bảng chuyển đổi mã IATA sang mã ICAO của mọi sân bay"],"a":[1],"e":"Dòng này ở cuối phần mã sân bay chỉ là tiêu đề. File không liệt kê mã IATA và ICAO cụ thể của các sân bay thường gặp.","w":{"a":"File không có danh sách này.","c":"File không có bảng này.","d":"File không có bảng này."},"t":"393"},{"s":4,"u":"Sức chịu tải mặt đường: phương pháp ACN-PCN","n":"394","q":"Sức chịu tải mặt đường sân bay được xác định theo phương pháp nào trong file?","o":["ILS-DME","TORA-TODA","ACN-PCN","CBR-K"],"a":[2],"e":"File ghi sức chịu tải mặt đường sân bay được xác định theo phương pháp ACN-PCN.","w":{"a":"ILS và DME là thiết bị dẫn đường, không liên quan đến sức chịu tải mặt đường.","b":"TORA và TODA là các cự ly công bố ở mục VI.","d":"CBR và K là các trị số trong bảng cường độ chịu lực, không phải tên phương pháp xác định sức chịu tải."},"t":"394"},{"s":4,"u":"Sức chịu tải mặt đường: phương pháp ACN-PCN","n":"395","q":"ACN trong phương pháp ACN-PCN là chỉ số nào?","o":["Chỉ số phân cấp sân bay theo mã số và mã chữ","Chỉ số phân cấp tàu bay (Aircraft Classification Number)","Chỉ số phân cấp mặt đường","Chỉ số áp suất bánh xe"],"a":[1],"e":"File ghi \"Chỉ số phân cấp tàu bay\" cho ACN và \"Chỉ số phân cấp mặt đường: Pavement Classification Number\" cho PCN.","w":{"a":"Đó là phân loại theo ICAO ở Chương I, không phải ACN.","c":"Đây là PCN.","d":"Áp suất bánh xe là một cột riêng của bảng, ghi bằng chữ W, X, Y, Z."},"t":"395","f":"File in tên tiếng Anh của ACN là \"Airport Classification Number\", trong khi tên tiếng Việt ngay cạnh là chỉ số phân cấp tàu bay. Tên chuẩn của ACN là Aircraft Classification Number, nên đáp án chọn theo tên tiếng Việt của file."},{"s":4,"u":"Sức chịu tải mặt đường: phương pháp ACN-PCN","n":"396","q":"PCN trong phương pháp ACN-PCN là chỉ số nào?","o":["Chỉ số phương pháp đánh giá","Chỉ số phân cấp mặt đường (Pavement Classification Number)","Chỉ số hệ số nền","Chỉ số phân cấp tàu bay"],"a":[1],"e":"PCN là chỉ số phân cấp mặt đường, tiếng Anh là Pavement Classification Number.","w":{"a":"Phương pháp đánh giá là một cột riêng của bảng, ghi bằng chữ T và U.","c":"Hệ số nền K là trị số trong cột của mặt đường cứng, không phải tên PCN.","d":"Đây là ACN."},"t":"396"},{"s":4,"u":"Sức chịu tải mặt đường: phương pháp ACN-PCN","n":"397","q":"PCN là viết tắt của cụm từ nào?","o":["Plane Classification Number","Pavement Classification Number","Pressure Classification Number","Pavement Capacity Number"],"a":[1],"e":"File ghi: Chỉ số phân cấp mặt đường: Pavement Classification Number (ACN-PCN).","w":{"a":"Chữ P đầu là Pavement, nghĩa là mặt đường.","c":"Chữ P đầu là Pavement, không liên quan áp suất.","d":"Chữ C là Classification, không phải Capacity."},"t":"397"},{"s":4,"u":"Sức chịu tải mặt đường: phương pháp ACN-PCN","n":"398","q":"Bảng sức chịu tải mặt đường trong file có mấy cột chính?","o":["3 cột","4 cột","5 cột","2 cột"],"a":[1],"e":"Bốn cột chính: loại mặt đường, cường độ chịu lực, áp suất bánh, phương pháp đánh giá.","w":{"a":"File có thêm cột thứ tư là phương pháp đánh giá.","c":"File có 4 cột chính.","d":"File có 4 cột chính."},"t":"398"},{"s":4,"u":"Sức chịu tải mặt đường: phương pháp ACN-PCN","n":"399","q":"Thứ tự các cột chính của bảng sức chịu tải mặt đường trong file là gì?","o":["Loại mặt đường; Cường độ chịu lực; Áp suất bánh; Phương pháp đánh giá","Cường độ chịu lực; Loại mặt đường; Áp suất bánh; Phương pháp đánh giá","Loại mặt đường; Áp suất bánh; Cường độ chịu lực; Phương pháp đánh giá","Loại mặt đường; Cường độ chịu lực; Phương pháp đánh giá; Áp suất bánh"],"a":[0],"e":"Tiêu đề bảng ghi lần lượt: Loại mặt đường, Cường độ chịu lực, Áp suất bánh, Phương pháp đánh giá.","w":{"b":"Hai cột đầu bị đảo. Cột đầu tiên là loại mặt đường.","c":"Hai cột giữa bị đảo. Cường độ chịu lực đứng trước áp suất bánh.","d":"Hai cột cuối bị đảo. Áp suất bánh đứng trước phương pháp đánh giá."},"t":"399"},{"s":4,"u":"Sức chịu tải mặt đường: phương pháp ACN-PCN","n":"400","q":"Cột \"Cường độ chịu lực\" của bảng gồm hai cột con. Hai cột con này là gì?","o":["R (mặt đường cứng, trị số hệ số nền) và F (mặt đường mềm, trị số sức chịu tải nền đất)","T và U","A và B","W và X"],"a":[0],"e":"Bảng con có tiêu đề \"Loại mặt đường\", \"R (trị số hệ số nền)\" và \"F (trị số sức chịu tải nền đất)\", với bốn hàng A, B, C, D.","w":{"b":"T và U là các chữ của cột phương pháp đánh giá.","c":"A, B, C, D là các hàng (mức cường độ), không phải hai cột con.","d":"W và X là các chữ của cột áp suất bánh."},"t":"400"},{"s":4,"u":"Sức chịu tải mặt đường: phương pháp ACN-PCN","n":"401","q":"Chữ \"Tb\" trong dòng \"X: Tb-giới hạn đến 1,5Mpa\" là viết tắt của từ nào?","o":["Tải biến thiên","Tổng bình","Tối đa","Trung bình"],"a":[3],"e":"X là mức áp suất bánh trung bình, giới hạn đến 1,5MPa. Chữ \"Tb\" là cách viết tắt của \"trung bình\".","w":{"a":"Từ viết tắt này không có nghĩa như vậy.","b":"Từ viết tắt này không có nghĩa như vậy.","c":"Mức tối đa là W, không hạn chế."},"t":"401"},{"s":4,"u":"Sức chịu tải mặt đường: phương pháp ACN-PCN","n":"402","q":"Chữ \"ko\" trong dòng \"W: cao, ko hạn chế\" là viết tắt của từ nào?","o":["Khống","Kiểm","Kỹ","Không"],"a":[3],"e":"W là mức áp suất bánh cao và không hạn chế.","w":{"a":"Từ đúng là \"không\".","b":"Từ đúng là \"không\".","c":"Từ đúng là \"không\". Kỹ thuật là phương pháp T, ở cột khác."},"t":"402"},{"s":4,"u":"Sức chịu tải mặt đường: phương pháp ACN-PCN","n":"403","q":"MPa trong cột áp suất bánh là đơn vị của đại lượng nào?","o":["Khối lượng","Tốc độ","Chiều dài","Áp suất"],"a":[3],"e":"Cột áp suất bánh ghi các giới hạn 1,5MPa, 1,0MPa, 0,5MPa. MPa là mega pascal, đơn vị đo áp suất.","w":{"a":"Khối lượng tính bằng kg hoặc tấn, không tính bằng MPa.","b":"Tốc độ tính bằng km/h hoặc nút, không tính bằng MPa.","c":"Chiều dài tính bằng mét, không tính bằng MPa."},"t":"403"},{"s":4,"u":"Sức chịu tải mặt đường: phương pháp ACN-PCN","n":"404","q":"MN/m3 trong cột mặt đường cứng là đơn vị của trị số nào?","o":["Áp suất bánh","Cường độ chịu lực nền A, B, C, D","Hệ số nền K","CBR"],"a":[2],"e":"Cột R ghi trị số hệ số nền K tính bằng MN/m3, ví dụ K = 150MN/m3.","w":{"a":"Áp suất bánh tính bằng MPa.","b":"A, B, C, D là mức của cường độ, không có đơn vị MN/m3.","d":"CBR là tỷ số phần trăm, thuộc cột mặt đường mềm."},"t":"404"},{"s":4,"u":"Sức chịu tải mặt đường: phương pháp ACN-PCN","n":"405","q":"CBR trong cột mặt đường mềm là viết tắt của cụm từ nào?","o":["Cement Binder Rate, tỷ lệ chất kết dính xi măng","California Bearing Ratio, tỷ số sức chịu tải California","Cumulative Braking Ratio, tỷ số hãm tích lũy","Concrete Base Rating, cấp nền bê tông"],"a":[1],"e":"File ghi cột F là \"trị số sức chịu tải nền đất\", biểu thị bằng CBR. CBR là California Bearing Ratio.","w":{"a":"CBR đo sức chịu tải nền đất, không liên quan đến xi măng.","c":"CBR đo sức chịu tải nền đất, không liên quan đến hãm.","d":"CBR dùng cho nền đất, không dùng cho cấp bê tông."},"t":"405"},{"s":4,"u":"Các cự ly được công bố: TORA, TODA, ASDA, LDA","n":"406","q":"Mục VI của Chương II liệt kê mấy cự ly được công bố?","o":["4 cự ly: TORA, TODA, ASDA, LDA","5 cự ly, thêm cự ly dải quang","3 cự ly: TORA, TODA, LDA","2 cự ly: TORA và LDA"],"a":[0],"e":"File đánh số: 1. TORA, 2. TODA, 3. ASDA, 4. LDA.","w":{"b":"Dải quang là phần cộng thêm vào TODA, không phải cự ly thứ năm.","c":"File còn có ASDA, cự ly hãm đà.","d":"File liệt kê 4 cự ly."},"t":"406"},{"s":4,"u":"Các cự ly được công bố: TORA, TODA, ASDA, LDA","n":"407","q":"Thứ tự bốn cự ly trong mục VI là gì?","o":["TORA, ASDA, TODA, LDA","TODA, TORA, ASDA, LDA","TORA, TODA, ASDA, LDA","LDA, TORA, TODA, ASDA"],"a":[2],"e":"Mục 1 TORA, mục 2 TODA, mục 3 ASDA, mục 4 LDA.","w":{"a":"ASDA đứng sau TODA, không đứng trước.","b":"TORA đứng đầu danh sách.","d":"LDA, cự ly hạ cánh, đứng cuối danh sách."},"t":"407"},{"s":4,"u":"Các cự ly được công bố: TORA, TODA, ASDA, LDA","n":"408","q":"Chữ A ở cuối các viết tắt TORA, TODA, ASDA, LDA là từ nào?","o":["Aircraft","Approach","Airport","Available"],"a":[3],"e":"Cả bốn tên đều có \"Available\": Take Off Run Available, Take Off Distance Available, Accelerate Stop Distance Available, Landing Distance Available.","w":{"a":"Chữ A cuối là Available, nghĩa là công bố, sẵn có.","b":"Chữ A cuối là Available.","c":"Chữ A cuối là Available."},"t":"408"},{"s":4,"u":"Các cự ly được công bố: TORA, TODA, ASDA, LDA","n":"409","q":"TORA là viết tắt của cụm từ nào?","o":["Total Runway Available","Take Off Route Available","Take Off Run Available","Take Off Runway Area"],"a":[2],"e":"File ghi \"Cự ly chạy đà (Take Off Run Available)\".","w":{"a":"Tên đúng là Take Off Run Available.","b":"Chữ R là Run, nghĩa là chạy đà.","d":"Tên đúng là Take Off Run Available."},"t":"409"},{"s":4,"u":"Các cự ly được công bố: TORA, TODA, ASDA, LDA","n":"410","q":"TORA có tên tiếng Việt là gì trong file?","o":["Cự ly cất cánh","Cự ly chạy đà","Cự ly hạ cánh","Cự ly hãm đà"],"a":[1],"e":"TORA là cự ly chạy đà, TODA là cự ly cất cánh, ASDA là cự ly hãm đà, LDA là cự ly hạ cánh.","w":{"a":"Đây là tên tiếng Việt của TODA.","c":"Đây là tên tiếng Việt của LDA.","d":"Đây là tên tiếng Việt của ASDA."},"t":"410"},{"s":4,"u":"Các cự ly được công bố: TORA, TODA, ASDA, LDA","n":"411","q":"TORA là gì theo định nghĩa của file?","o":["Phần chiều dài thực của đường chạy đà cộng với chiều dài dải quang","Phần chiều dài thực của đoạn đường CHC được công bố và thích hợp cho máy bay tính toán chạy đà trên mặt đất để cất cánh","Phần chiều dài thực của đường chạy đà cộng với chiều dài dải hãm đầu","Phần chiều dài hạ cánh thực của đường CHC được công bố và thích hợp cho tàu bay hạ cánh"],"a":[1],"e":"TORA là phần chiều dài thực của đoạn đường CHC được công bố và thích hợp cho máy bay tính toán chạy đà trên mặt đất để cất cánh.","w":{"a":"Đây là TODA.","c":"Đây là ASDA.","d":"Đây là LDA."},"t":"411"},{"s":4,"u":"Các cự ly được công bố: TORA, TODA, ASDA, LDA","n":"412","q":"TODA là viết tắt của cụm từ nào?","o":["Take Off Distance Available","Take Off Deceleration Available","Take Off Distance Allowed","Total Distance Available"],"a":[0],"e":"File ghi \"Cự ly cất cánh (Take Off Distance Available)\".","w":{"b":"Chữ D thứ hai là Distance, nghĩa là cự ly.","c":"Chữ cuối là Available.","d":"Tên đúng là Take Off Distance Available."},"t":"412"},{"s":4,"u":"Các cự ly được công bố: TORA, TODA, ASDA, LDA","n":"413","q":"TODA có tên tiếng Việt là gì trong file?","o":["Cự ly cất cánh","Cự ly chạy đà","Cự ly hãm đà","Cự ly hạ cánh"],"a":[0],"e":"TODA là cự ly cất cánh.","w":{"b":"Đây là tên tiếng Việt của TORA.","c":"Đây là tên tiếng Việt của ASDA.","d":"Đây là tên tiếng Việt của LDA."},"t":"413"},{"s":4,"u":"Các cự ly được công bố: TORA, TODA, ASDA, LDA","n":"414","q":"TODA được tính bằng công thức nào theo file?","o":["TORA cộng với chiều dài dải hãm đầu","Chiều dài hạ cánh thực của đường CHC","TORA cộng với chiều dài dải quang (nếu có)","TORA trừ đi chiều dài dải quang"],"a":[2],"e":"File ghi: TODA là phần chiều dài thực của đoạn đường chạy đà có thể (TORA) cộng với chiều dài của dải quang nếu có.","w":{"a":"Đây là cách tính ASDA.","b":"Đây là LDA.","d":"File dùng phép cộng, không trừ."},"t":"414"},{"s":4,"u":"Các cự ly được công bố: TORA, TODA, ASDA, LDA","n":"415","q":"Dải quang (Clearway) là gì theo file?","o":["Phần chiều dài thực của đường CHC dành cho hạ cánh","Khu vực hình chữ nhật không có chướng ngại vật, do nhà khai thác sân bay quản lý, tạo thuận tiện cho máy bay thực hiện đoạn cất cánh ban đầu","Đoạn đường hình chữ nhật ở cuối đường chạy đà, chuẩn bị cho máy bay dừng khi cất cánh bỏ dở","Dải đất hai bên đường CHC dành cho xe cứu hỏa"],"a":[1],"e":"File ghi dải quang là khu vực mặt đất hoặc mặt nước hình chữ nhật không có chướng ngại vật, do nhà khai thác sân bay quản lý, lựa chọn hay chuẩn bị, tạo thành khu vực thuận tiện cho máy bay thực hiện đoạn cất cánh ban đầu đến độ cao quy định ở phía trên nó.","w":{"a":"Đây là cự ly hạ cánh LDA.","c":"Đây là khoảng dừng (Stopway).","d":"File không nêu khu vực này."},"t":"415"},{"s":4,"u":"Các cự ly được công bố: TORA, TODA, ASDA, LDA","n":"416","q":"Tên gọi nào khác của dải quang được nêu trong file?","o":["Khoảng dừng (Stopway)","Khoảng trống (Clearway)","Dải an toàn đầu đường CHC","Dải hãm đầu"],"a":[1],"e":"File ghi \"Dải quang hay khoảng trống (Clearway)\".","w":{"a":"Khoảng dừng là tên của dải hãm đầu.","c":"File không nêu tên này.","d":"Đây là tên khác của khoảng dừng, dùng cho ASDA."},"t":"416"},{"s":4,"u":"Các cự ly được công bố: TORA, TODA, ASDA, LDA","n":"417","q":"Dải quang có thể là loại bề mặt nào?","o":["Chỉ mặt đất","Mặt đường bê tông xi măng","Chỉ mặt nước","Mặt đất hoặc mặt nước"],"a":[3],"e":"File ghi \"một khu vực mặt đất hoặc mặt nước hình chữ nhật\".","w":{"a":"File ghi mặt đất hoặc mặt nước.","b":"File không yêu cầu mặt đường bê tông.","c":"File ghi mặt đất hoặc mặt nước."},"t":"417"},{"s":4,"u":"Các cự ly được công bố: TORA, TODA, ASDA, LDA","n":"418","q":"Dải quang phải có đặc điểm gì về chướng ngại vật?","o":["Có chướng ngại vật nhưng phải được thông báo cho AIS","Chỉ cho phép chướng ngại vật đã đánh dấu","Không có chướng ngại vật","Có chướng ngại vật nhưng thấp dưới 3m"],"a":[2],"e":"File ghi dải quang là khu vực hình chữ nhật \"không có chướng ngại vật\".","w":{"a":"File ghi không có chướng ngại vật.","b":"File ghi không có chướng ngại vật.","d":"File ghi không có chướng ngại vật."},"t":"418"},{"s":4,"u":"Các cự ly được công bố: TORA, TODA, ASDA, LDA","n":"419","q":"Ai quản lý, lựa chọn hoặc chuẩn bị dải quang theo file?","o":["Đài chỉ huy tại sân (tower)","Nhà khai thác sân bay","Cơ sở AIS","Hãng hàng không"],"a":[1],"e":"File ghi dải quang \"được Nhà khai thác sân bay quản lý, lựa chọn hay chuẩn bị\".","w":{"a":"File ghi nhà khai thác sân bay quản lý dải quang.","c":"AIS chỉ nhận thông tin thông báo, không quản lý dải quang.","d":"File ghi nhà khai thác sân bay quản lý dải quang."},"t":"419"},{"s":4,"u":"Các cự ly được công bố: TORA, TODA, ASDA, LDA","n":"420","q":"Dải quang tạo thuận tiện cho tàu bay làm việc gì?","o":["Dừng khi cất cánh bỏ dở","Hạ cánh chạy trên mặt đất","Chạy đà trên mặt đất","Thực hiện đoạn cất cánh ban đầu đến độ cao quy định ở phía trên nó"],"a":[3],"e":"File ghi dải quang là khu vực thuận tiện cho máy bay thực hiện một đoạn cất cánh ban đầu đến độ cao quy định ở phía trên nó.","w":{"a":"Việc này thuộc về khoảng dừng (Stopway).","b":"Việc này thuộc về cự ly hạ cánh LDA.","c":"Chạy đà trên mặt đất thuộc về đoạn đường CHC (TORA)."},"t":"420"},{"s":4,"u":"Các cự ly được công bố: TORA, TODA, ASDA, LDA","n":"421","q":"ASDA là viết tắt của cụm từ nào?","o":["Accelerate Stop Distance Available","Airport Safety Distance Available","Accelerate Stopway Distance Area","Aircraft Stopping Distance Available"],"a":[0],"e":"File ghi \"Cự ly hãm đà hay cự ly có thể dừng khẩn cấp (Accelerate Stop Distance Available)\".","w":{"b":"Tên đúng là Accelerate Stop Distance Available.","c":"Chữ cuối là Available.","d":"Chữ A đầu là Accelerate, nghĩa là tăng tốc."},"t":"421"},{"s":4,"u":"Các cự ly được công bố: TORA, TODA, ASDA, LDA","n":"422","q":"ASDA có tên tiếng Việt là gì trong file?","o":["Cự ly hạ cánh","Cự ly chạy đà","Cự ly hãm đà hay cự ly có thể dừng khẩn cấp","Cự ly cất cánh"],"a":[2],"e":"ASDA là cự ly hãm đà, còn gọi là cự ly có thể dừng khẩn cấp.","w":{"a":"Đây là tên tiếng Việt của LDA.","b":"Đây là tên tiếng Việt của TORA.","d":"Đây là tên tiếng Việt của TODA."},"t":"422"},{"s":4,"u":"Các cự ly được công bố: TORA, TODA, ASDA, LDA","n":"423","q":"ASDA được tính bằng công thức nào theo file?","o":["Chiều dài hạ cánh thực của đường CHC","TORA cộng với chiều dài dải quang","TORA cộng với chiều dài dải hãm phanh đầu (dải hãm đầu)","TORA trừ đi chiều dài dải hãm đầu"],"a":[2],"e":"File ghi: ASDA là phần chiều dài thực của đoạn đường chạy đà có thể (TORA) cộng với chiều dài của dải hãm phanh đầu, còn gọi là dải hãm đầu.","w":{"a":"Đây là LDA.","b":"Đây là cách tính TODA.","d":"File dùng phép cộng, không trừ."},"t":"423"},{"s":4,"u":"Các cự ly được công bố: TORA, TODA, ASDA, LDA","n":"424","q":"Khoảng dừng (Stopway) là gì theo file?","o":["Đoạn đường xác định hình chữ nhật ở cuối đường chạy đà có thể công bố, chuẩn bị cho máy bay dừng khi cất cánh bỏ dở","Đoạn đường lăn nối sân đỗ với đường CHC","Phần đầu đường CHC dành cho tàu bay chờ cất cánh","Khu vực không có chướng ngại vật để máy bay cất cánh ban đầu"],"a":[0],"e":"File ghi: khoảng dừng là một đoạn đường xác định trên mặt đất hình chữ nhật ở cuối chiều dài đoạn đường chạy đà
